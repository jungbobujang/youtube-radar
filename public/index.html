<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>유튜브 레이더</title>
<style>
  :root {
    --bg: #f4f4f1;
    --surface: #ffffff;
    --ink: #22261f;
    --ink-soft: #5c6157;
    --ink-faint: #9a9e94;
    --line: #e3e4de;
    --accent: #2f6b4f;
    --danger: #b23a2e;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Pretendard Variable', Pretendard, -apple-system, sans-serif;
    font-size: 15px; line-height: 1.6;
  }
  button { font: inherit; cursor: pointer; }
  input, select { font: inherit; }

  .wrap { max-width: 880px; margin: 0 auto; padding: 16px 16px 80px; }

  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 8px 0 16px; }
  .brand {
    display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px;
    background: none; border: none; padding: 0; color: inherit; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .brand:hover .brand-mark { background: var(--accent); }
  .brand:active { opacity: .7; }
  .brand-mark {
    width: 34px; height: 34px; display: grid; place-items: center;
    background: var(--ink); color: var(--bg); border-radius: 9px; font-size: 17px;
  }

  /* 라벨은 절대 접지 않는다. 접히면 '승격' 이 '승/격' 으로 쌓여 행 높이가 들쭉날쭉해진다. */
  .btn, .btn-ghost { white-space: nowrap; }
  .btn {
    background: var(--ink); color: #fff; border: none;
    border-radius: var(--radius); padding: 9px 16px; font-weight: 600;
  }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn-ghost {
    background: transparent; color: var(--ink-soft);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 13px;
  }
  .btn-sm { padding: 5px 10px; font-size: 13px; }

  /* 탭이 늘어나면 폰 폭을 넘는다. 줄바꿈 대신 가로 스크롤로 넘긴다. */
  .tabs {
    display: flex; gap: 4px; margin-bottom: 14px; border-bottom: 1px solid var(--line);
    flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    background: none; border: none; border-bottom: 2px solid transparent;
    padding: 8px 12px; margin-bottom: -1px; flex: none; white-space: nowrap;
    font-size: 14px; font-weight: 600; color: var(--ink-faint);
  }
  .tab-on { color: var(--ink); border-bottom-color: var(--ink); }

  /* 행 높이를 썸네일에 맞춰 고정한다. 지표가 몇 개든 줄이 흔들리지 않아야 훑기 좋다. */
  .row {
    display: flex; gap: 10px; align-items: center;
    padding: 9px 6px; margin: 0 -6px; min-height: 72px;
    border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: none; }
  .row:hover { background: rgba(255, 255, 255, .55); }
  .thumb { width: 96px; height: 54px; flex: none; border-radius: 6px; object-fit: cover; background: var(--line); }
  /* flex-basis 는 단위를 붙인다. 구형 iOS Safari 는 단위 없는 0 을 무효로 보고
     선언을 통째로 버려서, 글자 폭이 0 으로 수렴하는 사고가 난다. */
  .meta { flex: 1 1 0%; min-width: 0; max-width: 100%; }
  /* 위계: 제목(진하게) > 채널(중간) > 나머지 메타(연하게) */
  /* 제목은 어느 폭에서든 두 줄까지. 한 줄 말줄임으로 두면 넓은 화면에서도
     제목이 잘려 무슨 영상인지 모른다 (훑는 화면이라 제목이 제일 중요하다).
     -webkit-box 는 지원할 때만 켠다 — 지원하지 않는 브라우저에서 켜 두면 깨진다. */
  .title {
    display: block; min-width: 0; max-width: 100%;
    font-size: 14.5px; font-weight: 600; color: var(--ink); line-height: 1.4;
    text-decoration: none; overflow: hidden;
  }
  @supports (-webkit-line-clamp: 2) {
    .title {
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }
  }
  .title:hover { text-decoration: underline; }
  .sub { font-size: 12px; color: var(--ink-faint); display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; min-width: 0; }
  .sub .ch { color: var(--ink-soft); font-weight: 600; }

  .badge {
    font-size: 11px; font-weight: 600; padding: 2px 9px;
    border-radius: 999px; white-space: nowrap; flex: none;
  }
  .b-short { background: #faece7; color: #712b13; }
  .b-mid   { background: #faeeda; color: #633806; }
  .b-long  { background: #e1f5ee; color: #085041; }
  .b-pending { background: #f1efe8; color: #444441; }

  .delta { font-size: 12px; font-weight: 600; color: var(--accent); flex: none; }

  .notice {
    background: #faeeda; color: #633806; border-radius: var(--radius);
    padding: 10px 12px; font-size: 12.5px; margin-bottom: 14px;
  }
  /* 눌러서 다른 탭으로 넘어가는 알림 */
  .notice-go { cursor: pointer; }
  .notice-go:hover { background: #f6e3c6; }
  .form { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .form input, .form select {
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 8px 10px; font-size: 14px; background: var(--surface);
  }
  .form input { flex: 1; min-width: 160px; }
  .off { opacity: .45; }
  .empty, .muted { color: var(--ink-faint); font-size: 13px; }
  .err { color: var(--danger); font-size: 13px; }

  .b-score { background: #e6f1fb; color: #0c447c; }
  .b-mult { background: #eeedfe; color: #3c3489; }

  /* 지표·버튼 묶음. 넓은 화면에서는 예전처럼 오른쪽에 한 줄로 붙는다. */
  /* min-width:0 이 없으면 뱃지 스트립의 min-content 가 부모 폭 계산을 밀어붙여
     옆 칸(제목)을 0 으로 짜부라뜨린다. 그리드에서 이 칸이 두 컬럼을 span 하면 특히 위험하다. */
  .tools { display: flex; align-items: center; gap: 8px; flex: none; min-width: 0; max-width: 100%; }

  .filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .fstrip { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 0; }
  .filters select, .fstrip select {
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 7px 10px; font-size: 13.5px; background: var(--surface);
  }
  .idea { flex: none; white-space: nowrap; }

  /* 지표 열은 폭을 고정해 행마다 뱃지가 같은 자리에서 시작하게 한다 */
  .metrics {
    display: flex; gap: 5px; flex: 0 0 296px; flex-wrap: wrap;
    justify-content: flex-end; max-width: 296px; min-width: 0;
  }
  /* 3단계 톤 — 기본(보통) / m-good(좋음) / m-warn(주의). 배율·침투·참여가 이 규칙을 쓴다. */
  .m {
    font-size: 10.5px; font-weight: 600; padding: 2px 7px;
    border-radius: 999px; white-space: nowrap;
    background: #f1efe8; color: #444441;
  }
  /* 분포 등급 — 숫자는 그대로 두고 등급만 색 글자로 병기한다 */
  .g { font-style: normal; font-weight: 700; font-size: 9.5px; margin-left: 3px; }
  .g-great { color: #0a6b4a; }
  .g-normal { color: var(--ink-faint); }
  .g-low { color: #c2554a; }

  .m-good, .m-fresh { background: #e1f5ee; color: #085041; }
  .m-warn, .m-sat { background: #faeeda; color: #633806; }
  /* 💀 완전 휴면 — 경고(주황)와 갈라 놓는다. 나쁜 신호가 아니라 '멈춘 채널' 이라는 사실 표시다. */
  .m-dead { background: #eceae4; color: #55534d; }
  /* 아래 둘은 많고 적음이 아니라 성격이 다른 신호라 톤을 따로 쓴다 */
  .m-hot { background: #fbeaf0; color: #72243e; }
  .m-debate { background: #e6f1fb; color: #0c447c; }
  /* 민감 주제(🅐 전용) — 경고가 아니라 '어느 채널용인가' 표시라 톤을 따로 쓴다 */
  .m-sensitive { background: #efe9fb; color: #4a2f7a; }

  .star {
    background: none; border: none; padding: 0 3px; flex: none;
    font-size: 16px; color: var(--line); line-height: 1;
  }
  .star:hover { color: #d99a1b; }
  .star-on { color: #d99a1b; }
  .heart {
    background: none; border: none; padding: 0 3px; flex: none;
    font-size: 15px; line-height: 1; filter: grayscale(1); opacity: .55;
  }
  .heart:hover, .heart-on { filter: none; opacity: 1; }

  /* 용도 태그 A~E */
  /* 지표 스트립 안에 함께 흐른다 (밖에 두면 제목 칸을 밀어낸다) */
  .tchips { display: inline-flex; gap: 3px; align-items: center; flex: none; margin-right: 2px; }
  .tchip {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-faint);
    border-radius: 999px; min-width: 24px; padding: 2px 7px;
    font-size: 11px; font-weight: 700; line-height: 1.5;
  }
  .tchip:hover { border-color: var(--ink-faint); color: var(--ink-soft); }
  .tchip-on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .tchip-none { background: #f1efe8; color: var(--ink-faint); }

  /* 🔥 HOT — 추천 채널 행 (썸네일 없이 채널 정보 + 대표작) */
  .hot-ch .meta { min-width: 0; }
  .hot-hit {
    display: flex; gap: 8px; align-items: baseline; margin-top: 4px;
    font-size: 12.5px; line-height: 1.5;
  }
  .hot-hit a { color: var(--ink-soft); text-decoration: none; overflow: hidden;
               text-overflow: ellipsis; white-space: nowrap; }
  .hot-hit a:hover { color: var(--ink); text-decoration: underline; }
  .hot-hit .muted { flex: none; }

  /* 개념 태그 — 제목 아래 한 줄. 지표 스트립과 달리 넘치면 줄바꿈한다. */
  .ctags { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 5px; }
  .ctag {
    display: inline-flex; align-items: center; overflow: hidden;
    border: 1px solid var(--line); border-radius: 999px; background: var(--surface);
  }
  .ctag-go, .ctag-x {
    border: none; background: none; color: var(--ink-soft);
    font-size: 11px; line-height: 1.6; padding: 2px 4px 2px 8px;
  }
  .ctag-x { padding: 2px 8px 2px 4px; color: var(--ink-faint); font-size: 12px; }
  .ctag-go:hover { color: var(--ink); }
  .ctag-x:hover { color: #a3222d; }
  .ctag-in {
    border: 1px dashed var(--line); border-radius: 999px; background: none;
    color: var(--ink); font: inherit; font-size: 11px; padding: 2px 9px;
    width: 150px; max-width: 100%;
  }
  .ctag-in:focus { border-style: solid; border-color: var(--ink-faint); outline: none; }
  .ctag-in::placeholder { color: var(--ink-faint); }
  .toast { margin: 0 0 8px; }
  /* 되돌릴 수 있는 알림 — 실패가 아니라 '방금 한 일' 이라 경고 톤을 쓰지 않는다 */
  .toast-undo {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: #eef1f6; color: #33415c; border-radius: var(--radius);
    padding: 8px 12px; font-size: 13px;
  }
  .toast-btn {
    border: 1px solid #c3cbd9; background: #fff; color: #33415c;
    border-radius: 999px; padding: 3px 12px; font-size: 12.5px; font-weight: 600;
    white-space: nowrap; flex: none;
  }
  .toast-btn:hover { border-color: #8f9cb3; }
  .toast-btn:disabled { opacity: .6; }

  /* 🚫 관심없음 목록 (감시 관리 안쪽 접이식) */
  .dis-box {
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 8px 12px; margin: 14px 0 4px; background: var(--surface);
  }
  .dis-box > summary { cursor: pointer; font-size: 14px; font-weight: 700; }
  .dis-row { min-height: 56px; }
  .rel { flex: none; white-space: nowrap; }

  .relpanel, .cmtpanel {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 10px 12px; margin: 0 0 10px;
  }

  /* 댓글 패널 */
  .cmt { flex: none; white-space: nowrap; }
  .cmt-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
  .cmt-acts { margin-left: auto; display: flex; gap: 6px; }
  .cmt-top {
    margin: 0 0 10px; padding: 8px 10px; border-radius: var(--radius);
    background: #f6f4ee; color: var(--ink-soft); font-size: 13px; line-height: 1.6;
  }
  /* 길어지면 패널이 화면을 다 먹는다. 안에서 스크롤한다. */
  .cmt-list { max-height: 420px; overflow-y: auto; }
  .cmt-row { padding: 8px 0; border-top: 1px solid var(--line); }
  .cmt-row:first-child { border-top: none; }
  .cmt-row p { margin: 3px 0 0; font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .rel-head { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  .rel-kw {
    flex: 1; min-width: 140px; border: 1px solid var(--line);
    border-radius: var(--radius); padding: 6px 10px; font-size: 13px;
  }
  .rel-kw:focus { border-color: var(--accent); outline: none; }
  .rel-kws { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
  .chip-kw {
    background: var(--bg); border: 1px solid var(--line); border-radius: 999px;
    padding: 3px 10px; font-size: 12px; color: var(--ink-soft);
  }
  .chip-kw:hover { border-color: var(--ink-faint); }
  .rel-row { padding: 6px 0; border-bottom: 1px solid var(--line); }
  .rel-row:last-of-type { border-bottom: none; }
  .rel-row a { font-size: 13px; color: var(--ink); text-decoration: none; font-weight: 600; }
  .rel-row a:hover { text-decoration: underline; }
  .rel-msg { margin: 8px 0 0; font-size: 12px; }

  .gm { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .gm-icon { background: none; border: none; padding: 0; font-size: 14px; line-height: 1; }
  .gm-name {
    border: none; background: none; font: inherit; font-size: 13px;
    width: 108px; padding: 2px 4px; border-radius: 6px; color: var(--ink);
  }
  .gm-name:hover { background: var(--bg); }
  .gm-name:focus { outline: 1px solid var(--accent); background: #fff; }

  .gchips { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 3px; }
  .chip-g {
    background: var(--bg); border: 1px solid var(--line); border-radius: 999px;
    padding: 1px 7px; font-size: 12px; line-height: 1.5; opacity: 0.4;
  }
  .chip-g:hover { opacity: 0.75; }
  .chip-g-on { opacity: 1; border-color: var(--ink); background: #fff; }

  .fmt { display: flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
  .fmt-b { border: none; background: none; padding: 7px 11px; font-size: 13px; color: var(--ink-faint); }
  .fmt-b:hover { color: var(--ink-soft); }
  .fmt-on { background: var(--ink); color: #fff; }
  .fmt-ov {
    font: inherit; font-size: 11.5px; color: var(--ink-soft);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 1px 6px; background: var(--surface); margin-left: 4px;
  }
  .hits { font-size: 11px; color: var(--accent); flex: none; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .sec { font-size: 13px; font-weight: 700; margin: 22px 0 8px; }
  .sec .muted { font-weight: 400; }

  .kws { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
  .kw {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 6px 4px 11px; font-size: 13px;
  }
  .kw button {
    background: none; border: none; padding: 0 3px;
    color: var(--ink-faint); font-size: 12px; line-height: 1;
  }
  .kw button:hover { color: var(--danger); }

  .cats { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-bottom: 6px; }
  .cat { display: flex; align-items: center; gap: 5px; font-size: 13.5px; }

  .gate { max-width: 320px; margin: 18vh auto; text-align: center; }
  .gate input {
    width: 100%; border: 1px solid var(--line); border-radius: var(--radius);
    padding: 10px 12px; font-size: 15px; margin: 14px 0 10px;
  }
  .hide { display: none; }

  /* ---------------------------------------------------------------- 💎 갱도 칩
     탭이 4개로 줄어든 대신, 광산 안에서 무엇을 캐는지는 이 칩 줄이 정한다.
     탭(밑줄)과 생김새를 일부러 다르게 둔다 — 같은 위계로 보이면 탭이 7개로 되돌아간 것처럼 읽힌다. */
  .shafts { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .shaft {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft);
    border-radius: 999px; padding: 7px 14px;
    font-size: 13.5px; font-weight: 600; white-space: nowrap;
  }
  .shaft:hover { border-color: var(--ink-faint); color: var(--ink); }
  .shaft-on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .shaft-on:hover { color: #fff; }

  /* ---------------------------------------------------------------- 뱃지 위계
     1열(.metrics)에는 종합 판단에 필요한 것만 남긴다 — 배율·참여·포화도(+🅐).
     배율·참여는 숫자만으로는 좋은지 나쁜지 모르므로 뱃지 바탕을 등급색으로 칠한다. */
  .m-gr-great { background: #e1f5ee; color: #085041; }
  .m-gr-low   { background: #f7e8e6; color: #8d2f24; }
  /* 바탕이 이미 등급색이면 Great/Low 글자까지 색을 달리할 이유가 없다 (읽기만 어려워진다) */
  .m-gr-great .g, .m-gr-low .g { color: inherit; opacity: .7; }

  /* 채널 활력(쇠락·상승)은 영상이 아니라 채널의 성질이다. 채널명 뒤에만 붙인다. */
  .vm { font-size: 11px; margin-left: 3px; cursor: help; }

  /* ---------------------------------------------------------------- ⋯ 상세 줄
     1열에서 뺀 지표(침투·일평균·최근7일·토론형·활력 상세)와
     기본 노출에서 뺀 동작(관련·댓글)이 여기로 모인다. */
  .rowdet {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 8px 6px 10px; margin: 0 -6px;
    border-bottom: 1px solid var(--line); background: rgba(255, 255, 255, .5);
  }
  /* .hide 는 위쪽에 있어 특정도가 같다 — 나중에 선언된 이 display:flex 가 이겨서
     접어 둔 상세 줄이 전부 펴진 채로 나왔다. 짝을 지어 다시 눌러 준다. */
  .rowdet.hide { display: none; }
  /* 상세 줄은 폭이 넉넉하니 좁은 화면에서도 버튼 글자를 남긴다 (🔎 만 있으면 뭘 하는 건지 모른다) */
  .rowdet .lbl { display: inline; }
  /* .metrics 를 재사용하지 않는다 — 좁은 폭에서 .metrics 는 가로 스크롤로 바뀌는데,
     상세 줄은 한눈에 다 보여야 하는 자리라 줄바꿈이 맞다. */
  .detm { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; flex: 1 1 220px; min-width: 0; }
  .det-acts { display: flex; gap: 6px; flex: none; flex-wrap: wrap; }
  .more { flex: none; }
  .more[aria-expanded="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }

  /* ---------------------------------------------------------------- 📥 브리핑 */
  .bcard {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px;
  }
  .bhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .bhead h3 { margin: 0; font-size: 14px; font-weight: 700; }
  .bhead .muted { font-weight: 400; }
  /* 링크는 항상 오른쪽 끝. 제목이 길어 접히면 다음 줄 오른쪽으로 내려간다. */
  .go {
    margin-left: auto; flex: none; background: none; border: none;
    color: var(--accent); font-size: 12.5px; font-weight: 600; padding: 4px 0;
    white-space: nowrap;
  }
  .go:hover { text-decoration: underline; }
  /* 카드 안 목록은 카드가 이미 테두리를 가지므로 마지막 줄만 선을 뗀다 */
  .bcard > .row:last-of-type { border-bottom: none; }
  .blines { margin: 0; font-size: 13px; color: var(--ink-soft); line-height: 1.9; }
  .blines b { color: var(--ink); }
  /* 경고는 이상할 때만 나온다. 평소에도 빨간 글자가 있으면 진짜일 때 안 보인다. */
  .blines .wa { color: var(--danger); }
  .bstat { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 2px; }
  .quiet { text-align: center; padding: 30px 16px; font-size: 15px; color: var(--ink-soft); }

  /* ---------------------------------------------------------------- 접이식 묶음
     신작의 '이 채널 N건 더', 관리 탭의 추적 중·주간 리포트가 같이 쓴다. */
  .more-ch {
    border: 1px dashed var(--line); border-radius: var(--radius);
    padding: 0 12px; margin: 0 0 8px; background: var(--surface);
  }
  .more-ch > summary { cursor: pointer; font-size: 12.5px; color: var(--ink-soft); padding: 8px 0; }
  .more-ch > summary:hover { color: var(--ink); }
  .more-ch[open] > summary { border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .sec-box {
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--surface); padding: 0 14px; margin-bottom: 10px;
  }
  .sec-box > summary { cursor: pointer; font-size: 14px; font-weight: 700; padding: 11px 0; }
  .sec-box[open] > summary { border-bottom: 1px solid var(--line); }
  .sec-body { padding: 8px 0 12px; }

  /* ---------------------------------------------------------------- 상태바 */
  .statusbar {
    display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 8px 12px; margin-bottom: 12px;
    font-size: 12px; color: var(--ink-soft);
  }
  .statusbar:empty { display: none; }
  .st { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .st b { color: var(--ink); font-weight: 600; }
  .st-warn b { color: #8a5a06; }
  .st-danger b { color: var(--danger); }
  .st-live { color: var(--accent); font-weight: 700; }
  .dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .2 } }
  .bar {
    flex: 1; min-width: 80px; max-width: 220px; height: 5px;
    background: var(--line); border-radius: 999px; overflow: hidden;
  }
  .bar > span { display: block; height: 100%; background: var(--accent); }
  .bar-warn > span { background: #c98a15; }
  .bar-danger > span { background: var(--danger); }

  /* ---------------------------------------------------------------- 로딩·빈 상태 */
  .sk { display: flex; gap: 10px; align-items: center; padding: 9px 0; min-height: 72px; border-bottom: 1px solid var(--line); }
  .sk-box {
    background: linear-gradient(90deg, #eceae4 25%, #f7f6f2 37%, #eceae4 63%);
    background-size: 400% 100%; border-radius: 6px;
    animation: sheen 1.4s ease infinite;
  }
  @keyframes sheen { 0% { background-position: 100% 0 } 100% { background-position: 0 0 } }

  .state { text-align: center; padding: 36px 16px; }
  .state h4 { margin: 0 0 5px; font-size: 14.5px; color: var(--ink); }
  .state p { margin: 0 0 12px; font-size: 13px; color: var(--ink-faint); }

  /* ---------------------------------------------------------------- 데스크톱 (769px~)
     한 줄 배치 — 썸네일 | 제목·채널·조회·날짜 | 지표 뱃지 | 버튼.
     880px 컨테이너에서는 지표(296px 고정) + 버튼 5개가 700px 가까이 먹어 제목 칸이
     36~117px 로 짜부라졌다 (제목이 "남들에…" 로만 보이고 메타가 세로로 쌓이던 버그).
     둘을 같이 고친다 — 컨테이너를 넓히고, 제목 칸에 최소 폭을 줘서 자리가 모자라면
     지표 쪽이 먼저 줄바꿈하도록 우선순위를 뒤집는다. */
  @media (min-width: 769px) {
    .wrap { max-width: 1240px; }
    /* 제목 칸이 먼저 자리를 갖는다. min-width 가 없으면 flex 가 0 까지 밀어 버린다. */
    .meta { flex: 1 1 auto; min-width: 140px; }
    /* 지표·버튼 묶음은 이제 줄어들 수 있다 (flex: none 이던 것이 사고의 절반이었다).
       단 min-width 는 auto(=min-content) 로 둔다 — 0 으로 두면 묶음이 제 내용보다
       작게 줄어들어 버튼이 오른쪽으로 삐져나간다 (안 줄어드는 것과 반대 방향의 같은 사고). */
    .tools { flex: 0 1 auto; min-width: auto; }
    /* 296px 는 이제 '되도록 이 폭' 이지 고정이 아니다. 모자라면 뱃지가 줄바꿈한다. */
    .metrics { flex: 0 1 296px; }
  }
  /* 노트북 폭(~1179px)에서는 버튼 라벨을 뗀다. 라벨 5개가 450px 를 먹어
     제목·지표가 동시에 굶는다 (라벨은 title 속성에 남아 있다). */
  @media (max-width: 1179px) {
    .lbl { display: none; }
  }
  /* 넉넉한 화면에서는 지표에도 바닥을 줘서 뱃지가 한 개씩 세로로 흘러
     행이 두 배로 높아지는 것을 막는다.
     제목 칸에는 바닥을 더 얹지 않는다 — 셋(제목·지표·버튼)에 전부 최소폭을 주면
     합이 화면을 넘어 버튼이 오른쪽으로 잘려 나간다 (1024px 에서 실제로 그랬다).
     버튼은 줄어들 수 없으니, 남는 자리는 제목이 알아서 가져간다. */
  @media (min-width: 1024px) {
    .metrics { min-width: 220px; }
  }

  /* ---------------------------------------------------------------- 터치 (~768px)
     태블릿 세로(768)까지는 손가락으로 누른다고 본다. 누르는 것은 전부 44px 이상. */
  @media (max-width: 768px) {
    .brand { min-height: 44px; }
    .btn { min-height: 44px; padding: 0 16px; }
    .btn-sm { min-height: 44px; padding: 0 12px; }
    .tab { min-height: 44px; padding: 0 13px; }
    .fmt-b { min-height: 44px; padding: 0 14px; white-space: nowrap; }
    .filters select, .fstrip select { min-height: 44px; padding: 0 10px; font-size: 14px; }
    .form input, .form select { min-height: 44px; padding: 0 10px; font-size: 14px; }
    .gate input, .rel-kw { min-height: 44px; }
    /* .gm-icon 과 ✕ 도 이 규칙을 탄다. 44 미만으로 두면 둘 다 작아진다. */
    .kw button { min-width: 44px; min-height: 44px; padding: 0 8px; font-size: 15px; }
    .gm-icon { min-width: 44px; min-height: 44px; font-size: 20px; }
    .gm-name { min-height: 44px; font-size: 14px; }
    .fmt-ov { min-height: 44px; font-size: 13px; padding: 0 8px; }
    .chip-g { min-height: 44px; padding: 0 12px; display: inline-flex; align-items: center; font-size: 15px; }
    .chip-kw { min-height: 44px; padding: 0 14px; display: inline-flex; align-items: center; }
    /* 갱도 칩·접이식 머리글·"전체 보기" 도 누르는 자리다 */
    .shaft { min-height: 44px; padding: 0 16px; display: inline-flex; align-items: center; font-size: 14px; }
    /* gap 이 없으면 flex 가 제목과 설명 사이 공백 텍스트 노드를 지워
       '주간 리포트지난 7일 요약' 처럼 붙어 버린다 */
    .more-ch > summary, .sec-box > summary {
      min-height: 44px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    }
    .go { min-height: 44px; display: inline-flex; align-items: center; font-size: 13px; }
    /* 체크박스는 라벨 전체가 누르는 자리다. 라벨을 44px 로 키운다. */
    .cat { min-height: 44px; }
    .cat input { width: 20px; height: 20px; }
    .tools .btn-sm, .tools .star, .tools .heart {
      flex: none; min-width: 44px; min-height: 44px;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .tools .star { font-size: 22px; padding: 0 8px; }
    .tools .heart { font-size: 18px; padding: 0 8px; }
    /* 상세 줄 버튼은 .tools 밖이라 위 규칙을 못 탄다. 따로 44px 를 준다. */
    .det-acts .btn-sm {
      min-height: 44px; display: inline-flex; align-items: center; justify-content: center;
    }
    .tchip { min-width: 44px; min-height: 44px; font-size: 14px; }
    /* 태그는 눌러서 지우는 자리라 손가락 크기를 지킨다 */
    .ctag-go, .ctag-x { min-height: 36px; font-size: 13px; display: inline-flex; align-items: center; }
    .ctag-x { min-width: 32px; justify-content: center; }
    .ctag-in { min-height: 36px; font-size: 14px; }

    /* --- 영상 행: 2줄 그리드 (썸네일 96px + 나머지 전부)
       1줄 = 썸네일 + 제목, 2줄 = 지표 뱃지 + 버튼.
       버튼이 44px 로 커진 만큼 한 줄에 다 욱여넣으면 제목이 짜부라지고,
       형제들이 제각각 줄바꿈하면 썸네일만 한 줄을 차지한다.
       그래서 flex 대신 grid 로 자리를 못박는다.
       두 컬럼을 span 하는 .tools 에 min-width:0 이 없으면, 뱃지 스트립의
       min-content 가 그리드를 밀어 1fr 컬럼(제목 자리)을 0 으로 만든다.
       크롬은 남는 폭을 제목에 남겨 뒀지만 iOS Safari 는 0 까지 밀어버려
       한 글자씩 세로로 흘렀다. 아래 min-width:0 세 줄이 그 사고를 막는다. */
    .row-v {
      display: grid; grid-template-columns: 96px minmax(0, 1fr);
      gap: 8px 10px; align-items: start; padding: 10px 6px;
    }
    .row-v .thumb { width: 96px; height: 54px; grid-column: 1; grid-row: 1; }
    .row-v .meta {
      grid-column: 2; grid-row: 1;
      min-width: 0; max-width: 100%; overflow: hidden;
    }
    .row-v .tools {
      grid-column: 1 / -1; grid-row: 2; gap: 6px;
      min-width: 0; max-width: 100%; overflow: hidden;
    }
    /* grid 를 못 쓰는 환경(구형 웹뷰)을 위한 안전망 — flex 로도 2줄이 되게 둔다.
       grid 가 켜지면 아래 두 줄은 무시된다. */
    .row-v { flex-wrap: wrap; }
    .row-v .tools { flex: 1 0 100%; }

    /* 지표 뱃지와 버튼을 한 줄에 같이 두면, 버튼이 전부 44px 라 지표가 남는 폭을 갖는다.
       예심 행(승격·킵·제외·💡·⋯)에서는 그 남는 폭이 30px 남짓이라 1열 뱃지가
       사실상 사라졌다 — '항상 보이는 열' 이 안 보이면 위계를 나눈 뜻이 없다.
       그래서 지표에 한 줄을 통째로 주고 버튼을 다음 줄로 내린다. */
    .row-v .tools { flex-wrap: wrap; }
    /* 지표 뱃지는 제 줄 안에서 가로 스크롤. flex-end 인 채로 넘치면 앞쪽이 왼쪽으로
       잘려 스크롤로도 닿지 않는다 → flex-start. */
    .metrics {
      flex: 1 1 100%; min-width: 0; max-width: 100%; width: 100%; order: -1;
      flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start;
      -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 2px;
    }
    .metrics::-webkit-scrollbar { display: none; }
    .metrics > .m, .metrics > .tchips { flex: none; }
  }

  /* ---------------------------------------------------------------- 모바일 (~640px)
     영상 행 2줄 구조는 위 768px 블록이 맡는다. 여기는 폰 폭에서만 필요한
     글자 크기·카드화·가로 스크롤 칩 줄을 얹는다. */
  @media (max-width: 640px) {
    body { font-size: 14.5px; }
    .wrap { padding: 12px 12px 72px; }

    .sub { gap: 6px; font-size: 11.5px; min-width: 0; }
    .m { font-size: 11px; padding: 4px 9px; }

    /* 필터 줄의 버튼만 다시 접히게 둔다. '🔥 지금 탐사 (약 608유닛)' 처럼 긴 라벨이
       폰 폭에 한 줄로 안 들어가 화면을 옆으로 밀어낸다. 행 안의 버튼은 nowrap 그대로 —
       거기서 접히면 행 높이가 들쭉날쭉해진다. */
    .filters > .btn, .filters > .btn-ghost { white-space: normal; }

    /* 버튼은 아이콘만 남겨 지표가 볼 자리를 확보한다 (라벨은 title 속성에) */
    .tools .btn-sm { padding: 0 10px; font-size: 16px; }

    /* --- 필터: 가로 스크롤 칩 줄 */
    .filters { flex-wrap: nowrap; gap: 8px; }
    .fstrip {
      flex: 1 1 0%; min-width: 0; flex-wrap: nowrap;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      scrollbar-width: none; padding-bottom: 2px;
    }
    .fstrip::-webkit-scrollbar { display: none; }
    .fstrip select, .fstrip .fmt { flex: none; }
    .filters > .muted, .filters > #csv { flex: none; }

    .form input { flex: 1 1 100%; }
    .gm-name { width: auto; flex: 1 1 120px; }

    /* --- 표처럼 늘어놓던 것들을 카드로 */
    .row:not(.row-v) {
      flex-wrap: wrap; row-gap: 8px; align-items: center;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 10px 12px; margin: 0 0 8px;
    }
    .row:not(.row-v) .meta { flex: 1 1 100%; }
    .row:not(.row-v) .btn-ghost { flex: 1 1 0%; }
    .kw { padding: 4px 6px 4px 12px; flex-wrap: wrap; }
    .gm { gap: 8px; }
    .cats { flex-direction: column; gap: 0; }

    .hits { max-width: 100%; }
    .notice { font-size: 12px; }

    /* 브리핑 — 카드 여백을 줄여 한 화면에 두 칸이 들어오게 */
    .bcard { padding: 10px 12px; }
    .blines { font-size: 12.5px; line-height: 1.85; }
    /* 제목이 길면 "전체 보기 →" 가 다음 줄로 내려간다. margin-left:auto 는 그대로 둔다. */
    .bhead h3 { flex: 1 1 auto; min-width: 0; }

    /* 상세 줄 — 지표 한 덩어리, 동작 한 덩어리로 세로로 쌓는다 */
    .rowdet { padding: 8px 6px 10px; gap: 8px; }
    .detm { flex: 1 1 100%; }
    .det-acts { flex: 1 1 100%; }
    .det-acts .btn-sm { flex: 1 1 0%; }
    .rel-kw { flex: 1 1 100%; min-height: 44px; }
    .rel-head .btn-sm, .rel-head .btn { flex: 1 1 auto; }

    .statusbar { gap: 5px 10px; padding: 8px 10px; font-size: 11.5px; }
    .bar { flex: 1 0 100%; max-width: none; }
    .sk { min-height: 66px; }
    .sk-box:first-child { width: 92px !important; height: 52px !important; }
  }
</style>
</head>
<body>

<div id="gate" class="gate hide">
  <div class="brand-mark" style="margin: 0 auto 12px;">📡</div>
  <h1 style="font-size:17px;margin:0">유튜브 레이더</h1>
  <input id="code" type="password" placeholder="접속 코드" autocomplete="current-password">
  <button class="btn" id="enter" style="width:100%">들어가기</button>
  <p id="gate-err" class="err"></p>
</div>

<div id="app" class="wrap hide">
  <div class="topbar">
    <button class="brand" id="home" title="처음으로 (브리핑 탭 · 갱도·필터 초기화 · 새로고침)">
      <span class="brand-mark">📡</span> 유튜브 레이더
    </button>
    <button class="btn-ghost btn-sm" id="run">지금 수집</button>
  </div>

  <div class="statusbar" id="status"></div>

  <div class="tabs" id="tabs"></div>

  <div id="panel"></div>
</div>

<script>
const $ = (s) => document.querySelector(s)
// 탭은 네 칸뿐이다 — 브리핑(오늘 볼 것) · 광산(캐는 곳) · 후보함(담은 것) · 관리(설정·기록).
// 예전 탭 7개 중 발굴·신작·HOT 은 광산 안의 '갱도' 로, 추적 중·주간은 관리 안의 섹션으로 들어갔다.
let tab = 'brief'
let shaft = 'dig' // 광산 갱도: dig(묵은 검증) / fresh(신작) / hot / discover(급상승·설정 시에만)
// 신작은 채널이 올린 것을 전부 받아 오므로 그대로 두면 목록이 잡음이 된다.
// 기본은 '신호만' — Low 등급을 감추고 채널당 상위 몇 건만 편다.
let freshSignalOnly = true
const FRESH_PER_CHANNEL = 3
const BRIEF_ROWS = 5 // 브리핑에 미리 펴 두는 예심 행 수 (나머지는 후보함에서)
let settings = { trendingOn: false, prospectOn: false, channels: [], groups: [] }
let digPeriod = 'all'
let digChannel = 'all'
let digSort = 'dig'
let digGroup = 'all'
let digSubs = 'all'
let digFormat = 'long' // 주력이 롱폼이라 기본값
let showPicked = false // 담아 둔 영상을 목록에 포함할지 (기본 off)

    <select id="f-channel">

      ${settings.channels.map((c) => `<option value="${esc(c.value)}" ${digChannel === c.value ? 'selected' : ''}>${c.dormant ? dormantMark(c.dormant) + ' ' : ''}${esc(c.label)}</option>`).join('')}

function wireFilters() {

  bind('#f-subs', (v) => { digSubs = v })
  document.querySelectorAll('[data-fmt]').forEach((b) => {

  })
}

function filterQuery() {

    + `&subs=${digSubs}&format=${digFormat}&picked=${showPicked ? 1 : 0}`
}

function durLabel(sec) {
  if (sec == null) return ''
  const m = Math.floor(sec / 60)
  const s = sec % 60
  return `${m}:${String(s).padStart(2, '0')}`
}

const fmt = (n) => Number(n || 0).toLocaleString('ko-KR')

// 뱃지 안에 들어갈 짧은 수 (1234 -> 1.2천)
function shortNum(n) {
  const v = Number(n || 0)
  const abs = Math.abs(v)
  if (abs >= 1e8) return `${(v / 1e8).toFixed(1)}억`
  if (abs >= 1e4) return `${(v / 1e4).toFixed(1)}만`
  if (abs >= 1e3) return `${(v / 1e3).toFixed(1)}천`
  return String(Math.round(v))
}
const day = (iso) => iso ? new Date(iso).toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric' }) : ''
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

async function api(path, opts) {
  const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts })
  if (res.status === 401) { showGate(); throw new Error('unauthorized') }
  const data = await res.json()
  if (!res.ok) throw new Error(data.error || '요청 실패')
  return data
}

function showGate() { $('#gate').classList.remove('hide'); $('#app').classList.add('hide') }
async function showApp() {
  $('#gate').classList.add('hide')
  $('#app').classList.remove('hide')
  try { settings = await api('/api/settings') } catch { /* 게이트에서 처리 */ }
  renderTabs()
  render()
  refreshStatus()
}

function stateBox(title, desc, action = '') {
  return `<div class="state"><h4>${esc(title)}</h4><p>${esc(desc)}</p>${action}</div>`
}

// 행 하나가 사라졌을 때 상단 "N건" 을 다시 그리지 않고 숫자만 고친다
function bumpCount(panel, delta) {
  const el = panel.querySelector('[data-count]')
  if (!el) return
  const next = Math.max(0, Number(el.dataset.count) + delta)
  el.dataset.count = next
  el.textContent = `${next}건`
}

// 예심 대기 건수는 표시 문구가 달라 따로 센다 (승격·제외 때 즉시 줄어들게)
function bumpPending(panel, delta) {
  const el = panel.querySelector('[data-pending]')
  if (!el) return
  const next = Math.max(0, Number(el.dataset.pending) + delta)
  el.dataset.pending = next
  el.textContent = `검토 대기 ${next}건`
}

// 실패를 조용히 삼키지 않되 alert 로 막지도 않는다
function toast(panel, message) {
  let box = panel.querySelector('.toast')
  if (!box) {
    box = document.createElement('p')
    box.className = 'toast err'
    panel.prepend(box)
  }
  box.textContent = message
  clearTimeout(box._t)
  box._t = setTimeout(() => box.remove(), 4000)
}

// 되돌릴 수 있는 알림. 실패가 아니라 '방금 한 일' 을 알리는 자리라 err 톤을 쓰지 않는다.
// undo 를 누르면 되돌리고 토스트는 사라진다. ms 안에 안 누르면 그냥 사라진다.
function undoToast(panel, message, undoLabel, onUndo, ms = 3000) {
  const old = panel.querySelector('.toast-undo')
  if (old) { clearTimeout(old._t); old.remove() }

  const box = document.createElement('p')
  box.className = 'toast toast-undo'
  box.innerHTML = `<span>${esc(message)}</span>`

  const btn = document.createElement('button')
  btn.className = 'toast-btn'
  btn.textContent = undoLabel
  btn.onclick = async () => {
    clearTimeout(box._t)
    btn.disabled = true
    btn.textContent = '되돌리는 중…'
    try {
      await onUndo()
      box.remove()
    } catch (e) {
      box.className = 'toast err'
      box.textContent = `되돌리지 못했어요 — ${e.message}`
      box._t = setTimeout(() => box.remove(), 4000)
    }
  }
  box.appendChild(btn)

  panel.prepend(box)
  box._t = setTimeout(() => box.remove(), ms)
  return box
}

// 기본값이 아닌 필터가 하나라도 걸려 있으면 0건일 때 초기화 버튼을 붙인다
function filtersActive() {
  return digGroup !== 'all' || digChannel !== 'all' || digSubs !== 'all'
    || digFormat !== 'long' || digPeriod !== 'all'
}

function resetFilters() {
  digGroup = 'all'; digChannel = 'all'; digSubs = 'all'
  digFormat = 'long'; digPeriod = 'all'
  render()
}

function emptyWithReset(title, desc) {
  const action = filtersActive()
    ? '<button class="btn-ghost btn-sm" id="reset-filters">필터 초기화</button>'
    : ''

}

function wireReset(panel) {

}

// 모바일에서 1줄(썸네일+제목) / 2줄(지표+버튼)로 접히도록 지표·버튼을 .tools 로 묶는다.
// 묶어 두지 않으면 폭이 좁아질 때 형제들이 제각각 줄바꿈해 썸네일만 한 줄을 차지한다.
// 기본 노출은 [⭐] [💡 아이디어로] [⋯] 세 개뿐이다.
// 🔎 관련·💬 댓글처럼 '한 건을 파고들 때만' 쓰는 것은 [⋯] 안쪽 상세 줄로 내렸다.
function videoRow(v, extra = '', opts = {}) {
  const star = opts.tools ?? `
    <button class="star ${Number(v.pick_level ?? 0) >= 1 ? 'star-on' : ''}" data-star="${esc(v.video_id)}"
            aria-label="후보로 담기" title="후보로 담기 (목록에서 빠집니다)">★</button>`
  const idea = opts.idea ? ideaButton(v) : ''
  // noMore — 추적 중·급상승처럼 지표를 안 붙이는 목록에는 펼칠 것이 없다
  const more = opts.noMore ? '' : moreButton(v)
  const tools = opts.noTools ? '' : `${star}${idea}${more}`
  return `<div class="row row-v">
    <img class="thumb" loading="lazy" src="https://img.youtube.com/vi/${esc(v.video_id)}/mqdefault.jpg" alt="">
    <div class="meta">
      <a class="title" href="https://www.youtube.com/watch?v=${esc(v.video_id)}" target="_blank" rel="noopener noreferrer">${isGlobal(v) ? '🌍 ' : ''}${esc(v.title)}</a>
      <div class="sub">
        <span class="ch">${esc(v.channel_title || '')}${vitalityMark(v)}</span>
        <span title="${fmt(v.views ?? v.latest)}">조회 ${shortNum(v.views ?? v.latest)}</span>
        <span>${day(v.published_at)}</span>
        ${v.duration_sec != null ? `<span>${durLabel(v.duration_sec)}</span>` : ''}
      </div>
      ${opts.metaExtra ?? ''}
    </div>
    <div class="tools">${extra}${tools}</div>
  </div>
  ${opts.noMore ? '' : detailStrip(v, opts)}
  <div class="relpanel hide" data-panel="${esc(v.video_id)}"></div>
  <div class="cmtpanel hide" data-cpanel="${esc(v.video_id)}"></div>`
}

function moreButton(v) {
  return `<button class="btn-ghost btn-sm more" data-more="${esc(v.video_id)}"
    aria-expanded="false" title="상세 지표와 추가 동작 펼치기">⋯</button>`
}

// noRel — 🔎 관련은 그 영상 주제로 국내를 다시 검색하는 버튼이다. 해외 광맥 목록처럼
// '수확만 하는' 자리에서는 뺀다 (거기서 할 일은 ⭐ 담기와 💡 아이디어로 두 가지뿐).
function relButton(v) {
  return `<button class="btn-ghost btn-sm rel" data-rel="${esc(v.video_id)}" title="관련 주제">
    🔎<span class="lbl"> 관련</span></button>`
}

// [⋯] 로 펼치는 줄. 1열에서 뺀 지표와 기본 노출에서 뺀 동작이 함께 들어간다.
// 💬 댓글은 원래 후보함에서만 쓰던 버튼이라 (수집이 1유닛씩 든다) 그 자리에서만 켠다.
function detailStrip(v, opts = {}) {
  const bits = [
    `<span class="m" title="${reachTip(v)}">침투 ${v.reach == null ? '—' : v.reach.toFixed(2)}${gradeTag(v.grade?.reach)}</span>`,
    evergreenChip(v),
    saturationChip(v),
    v.hot_engage ? '<span class="m m-hot">💬 진한반응</span>' : '',
    v.debate ? '<span class="m m-debate">🗣️ 토론형</span>' : '',
    trendChip(v)
  ].filter(Boolean).join('')
  const acts = `${opts.noRel ? '' : relButton(v)}${opts.comments ? commentButton(v) : ''}`
  return `<div class="rowdet hide" data-det="${esc(v.video_id)}">
    <span class="detm">${bits}</span>
    ${acts ? `<span class="det-acts">${acts}</span>` : ''}
  </div>`
}

// 일평균 조회수 + 최근 N일 증가량. 스냅샷이 2개 미만이면 증가량만 '측정 중'.
function evergreenChip(v) {
  if (v.avg_daily_views == null) return ''
  const recent = v.velocity_pending
    ? '측정 중'
    : `최근7일 ${v.recent_delta >= 0 ? '+' : '−'}${shortNum(Math.abs(v.recent_delta))}`
  return `<span class="m">일평균 ${shortNum(v.avg_daily_views)} · ${recent}</span>`
}

// 1건은 우연일 수 있어 표시하지 않는다. 0건(공백)과 2건 이상(경쟁)만 신호로 본다.
function saturationChip(v) {
  if (v.saturation == null) return ''
  if (v.saturation === 0) return '<span class="m m-fresh">✅ 최근 재탕 없음</span>'
  if (v.saturation >= 2) return `<span class="m m-sat">⚠️ 최근 ${v.saturation}개 채널이 다룸</span>`
  return ''
}

// 1열용 — 낱말을 떼고 ✅/⚠️ 만 남긴다. 뜻은 title 로 읽는다.
// 목록을 훑을 때 필요한 건 '비었나 붐비나' 뿐이고, 몇 개인지는 [⋯] 에서 본다.
function saturationMark(v) {
  if (v.saturation == null) return ''
  if (v.saturation === 0) return '<span class="m m-fresh" title="최근 이 주제를 다룬 채널이 없습니다">✅</span>'
  if (v.saturation >= 2) return `<span class="m m-sat" title="최근 ${v.saturation}개 채널이 이 주제를 다뤘습니다">⚠️</span>`
  return ''
}

// 배수는 소수 1자리, 100 이상은 축약(x1.2천)해 뱃지 폭을 일정하게 둔다
const ratio = (n) => (Number(n) >= 100 ? shortNum(n) : Number(n || 0).toFixed(1))

// 채널 활력 — 자기 과거 대비. 구독자 수와 무관하다.
// 쇠락(<0.5)과 상승(>=1.5)만 표시하고 그 사이나 표본 부족은 아무것도 그리지 않는다.
function trendTip(v) {
  const base = '채널 활력 = 최근 90일 조회 중앙값 vs 이전 90일'
  if (v.vitality_recent == null) return base
  const n = v.vitality_n ? ` · 영상 ${v.vitality_n[0]}편 vs ${v.vitality_n[1]}편` : ''
  return `${base}\n최근 ${shortNum(v.vitality_recent)} vs 이전 ${shortNum(v.vitality_prev)}${n}`
}

// 숫자까지 보이는 상세판 — [⋯] 안쪽에서만 쓴다
function trendChip(v) {
  if (v.dead_channel) {
    return `<span class="m m-warn" title="${trendTip(v)}">⚠️ 쇠락 ${Number(v.vitality).toFixed(2)}x</span>`
  }
  if (v.rising_channel) {
    return `<span class="m m-good" title="${trendTip(v)}">📈 상승 ${Number(v.vitality).toFixed(2)}x</span>`
  }
  return ''
}

// 활력은 영상이 아니라 채널의 성질이다. 영상 행의 지표 줄에 섞여 있으면
// 이 영상이 쇠락했다는 말처럼 읽힌다 — 채널명 뒤에만 작게 붙인다.
function vitalityMark(v) {
  if (v.dead_channel) return `<span class="vm" title="${trendTip(v)}">⚠️</span>`
  if (v.rising_channel) return `<span class="vm" title="${trendTip(v)}">📈</span>`
  return ''
}

// 지금 목록의 분포에서 상위 25% / 하위 25% 를 등급으로 병기한다.
// 표본이 적으면 서버가 등급을 비워 보내고, 그때는 숫자만 나온다.
const GRADE_LABEL = { great: 'Great', normal: 'Normal', low: 'Low' }
const gradeTag = (kind) => (kind ? `<em class="g g-${kind}">${GRADE_LABEL[kind]}</em>` : '')

// 침투력 등급은 전체가 아니라 같은 체급(구독자 구간) 안에서의 상대평가다.
function reachTip(v) {
  const base = '침투력 = 조회수 / 구독자수 · 등급은 같은 체급 내 상대평가'
  if (!v.tier_label) return `${base} (구독자 미확인이라 등급 없음)`
  const pct = v.reach_pct == null ? '' : ` · 상위 ${Math.max(1, Math.round((1 - v.reach_pct) * 100))}%`
  return `${base}\n체급 ${v.tier_label}${pct}`
}

// 등급을 뱃지 바탕색으로 옮긴다. 숫자만 보고는 x3.2 가 좋은 값인지 알 수 없는데,
// 색이 있으면 훑는 것만으로 걸러진다. Normal 은 색을 주지 않는다 (평범한 게 기본값이라).
const GRADE_TONE = { great: 'm-gr-great', low: 'm-gr-low' }
const gradeTone = (kind) => GRADE_TONE[kind] ?? ''

function multipleChip(v) {
  const g = v.grade?.multiple
  return `<span class="m ${gradeTone(g)}" title="채널·형식별 조회수 중앙값 대비 배율${
    g ? ` · 지금 목록에서 ${GRADE_LABEL[g]}` : ''}">x${ratio(v.multiple)}${gradeTag(g)}</span>`
}

function engageChip(v) {
  const g = v.grade?.engage
  return `<span class="m ${gradeTone(g)}" title="(좋아요 + 댓글×3) / 조회수${
    g ? ` · 지금 목록에서 ${GRADE_LABEL[g]}` : ''}">참여 ${(v.engage ?? 0).toFixed(1)}%${gradeTag(g)}</span>`
}

// 1열 — '이 영상을 볼까 말까' 를 정하는 데 필요한 것만 남긴다.
//   배율(얼마나 터졌나) · 참여(사람이 반응했나) · 포화도(자리가 비었나) · 🅐(내 채널에 올릴 수 있나)
// 침투·일평균·최근7일·토론형·진한반응·활력 상세는 [⋯] 상세 줄로 내렸다.
// extra 는 .metrics 안쪽에 넣는다. 밖에 두면 .tools 의 min-content 가 커져
// 옆 칸(제목)을 밀어내 0 으로 만든다 (768px 에서 실제로 그렇게 깨졌다).

// ---------------------------------------------------------------- CSV 내보내기

const CSV_COLS = [
  ['제목', (v) => v.title ?? ''],
  ['채널', (v) => v.channel_title ?? ''],
  ['조회수', (v) => Number(v.views ?? 0)],
  ['배율', (v) => (v.multiple == null ? '' : Number(v.multiple).toFixed(2))],
  ['침투', (v) => (v.reach == null ? '' : Number(v.reach).toFixed(2))],
  ['참여', (v) => (v.engage == null ? '' : Number(v.engage).toFixed(2))],
  ['게시일', (v) => (v.published_at ? v.published_at.slice(0, 10) : '')],
  ['URL', (v) => `https://www.youtube.com/watch?v=${v.video_id}`]
]

// 제목에 쉼표·따옴표·줄바꿈이 흔하다. 전부 따옴표로 감싸고 내부 따옴표만 겹친다.
// 앞에 =,+,-,@ 가 오면 엑셀이 수식으로 읽으므로 작은따옴표를 덧댄다.
function csvCell(value) {
  const s = String(value ?? '')
  const safe = /^[=+\-@]/.test(s) ? `'${s}` : s
  return `"${safe.replace(/"/g, '""')}"`
}

function toCsv(rows) {
  const lines = [CSV_COLS.map(([h]) => csvCell(h)).join(',')]
  for (const v of rows) lines.push(CSV_COLS.map(([, get]) => csvCell(get(v))).join(','))
  return lines.join('\r\n')
}

function downloadCsv(filename, text) {
  // BOM 이 없으면 엑셀이 한글을 깨서 읽는다
  const blob = new Blob([`﻿${text}`], { type: 'text/csv;charset=utf-8' })
  const url = URL.createObjectURL(blob)
  const a = document.createElement('a')
  a.href = url
  a.download = filename
  document.body.appendChild(a)
  a.click()
  a.remove()
  setTimeout(() => URL.revokeObjectURL(url), 1000)
}

function todayStamp() {
  const d = new Date()
  const p = (n) => String(n).padStart(2, '0')
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`
}

// 최근 7일 구독자 증가. 이력이 7일치 쌓이기 전에는 '측정 중' 으로 둔다.
// 이력 테이블이 아직 없으면 서버가 아무것도 안 보내고, 그때는 칩 자체가 사라진다.
function growthChip(g) {
  if (!g) return ''
  if (g.pending) {
    return `<span class="m" title="하루 1회 기록 · 7일치가 쌓이면 표시됩니다">주간 구독 측정 중</span>`
  }
  const sign = g.delta > 0 ? '+' : g.delta < 0 ? '−' : ''
  const cls = g.delta > 0 ? 'm-good' : g.delta < 0 ? 'm-warn' : ''
  return `<span class="m ${cls}" title="최근 ${g.days}일 · 현재 ${fmt(g.subs)}명">
    주간 구독 ${sign}${shortNum(Math.abs(g.delta))}</span>`
}

const IDEA_FACE = '💡<span class="lbl"> 아이디어로</span>'

const tagList = (v) => (Array.isArray(v.concept_tags) ? v.concept_tags : [])

function ideaButton(v) {
  return `<button class="btn-ghost btn-sm idea" title="제목·링크 복사"
    data-title="${esc(v.title)}" data-vid="${esc(v.video_id)}"
    data-target="${esc(v.target_group ?? '')}"
    data-global="${isGlobal(v) ? '1' : ''}"
    data-tags="${esc(tagList(v).join(','))}">${IDEA_FACE}</button>`
}

// 복사 문구: "[해외] 원제 | URL" · "[D] 제목 | URL | #고독 #니체"
function ideaText(b) {
  const target = b.dataset.global ? '[해외] ' : (b.dataset.target ? `[${b.dataset.target}] ` : '')
  const tags = (b.dataset.tags || '').split(',').filter(Boolean)
  const tail = tags.length ? ` | ${tags.map((t) => `#${t}`).join(' ')}` : ''
  return `${target}${b.dataset.title} | https://www.youtube.com/watch?v=${b.dataset.vid}${tail}`
}

// ---------------------------------------------------------------- 🔥 HOT

// 해외 영상은 제목을 손대지 않는다. 원문 그대로 두고 표시만 구분한다.
const isGlobal = (v) => String(v.source ?? '').startsWith('hot:global')

// "2027. 2. 18. 해제 (183일 남음)" — 언제 다시 보이는지가 궁금한 값이다
function untilLabel(iso) {
  if (!iso) return '기한 없음'
  const t = new Date(iso).getTime()
  if (isNaN(t)) return '기한 없음'
  const days = Math.max(0, Math.ceil((t - Date.now()) / 864e5))
  return `${new Date(t).toLocaleDateString('ko-KR')} 해제 (${days}일 남음)`
}

// ---- 💀 휴면 판정 표시
// 서버(server.js 의 DORMANT)가 판정한 등급만 그린다. 여기서 다시 계산하지 않는다.
const DORMANT_FACE = { dead: '💀', dormant: '😴' }
const DORMANT_LABEL = { dead: '완전 휴면', dormant: '휴면' }

// 목록에 작게 붙이는 표식 (감시 관리·발굴 필터용)
function dormantMark(level) {
  return level ? DORMANT_FACE[level] ?? '' : ''
}

function dormantBadge(d) {
  if (!d?.level) return ''
  const months = d.months == null ? '' : ` ${d.months}개월`
  const tip = d.verified
    ? '유튜브에서 마지막 업로드를 직접 확인한 값'
    : 'DB 에 쌓인 영상 중 최신 게시일로 추정한 값 (탐사하면 확인됩니다)'
  return `<span class="m ${d.level === 'dead' ? 'm-dead' : 'm-warn'}" title="${esc(tip)}">
    ${DORMANT_FACE[d.level]} ${DORMANT_LABEL[d.level]}${months}${d.verified ? '' : ' · 추정'}</span>`
}

function commentButton(v) {
  return `<button class="btn-ghost btn-sm cmt" data-cmt="${esc(v.video_id)}"

// 요청·공감 신호는 서버가 센 값을 그대로 쓴다 (낱말 목록이 서버에 있다)
function commentHead(data, videoId) {
  const s = data.stats
  const top = s?.top
  return `<div class="cmt-head">
    <span class="m">💬 총 <b>${fmt(s?.total ?? 0)}</b>개</span>
    <span class="m" title="'해주세요 · 알려주세요 · 궁금' 이 들어간 댓글">🙋 요청 ${fmt(s?.requests ?? 0)}</span>
    <span class="m" title="'저도 · 공감 · 내 얘기' 가 들어간 댓글">🤝 공감 ${fmt(s?.empathy ?? 0)}</span>
    ${s?.collected_at ? `<span class="muted">${day(s.collected_at)} 수집</span>` : ''}
    <span class="cmt-acts">
      <button class="btn-ghost btn-sm cmt-copy" data-ccopy="${esc(videoId)}">📋 댓글 복사</button>
      <button class="btn-ghost btn-sm cmt-refresh" data-crefresh="${esc(videoId)}"
        title="유튜브에서 다시 받아옵니다">↻ 갱신 (1유닛)</button>
    </span>
  </div>
  ${top ? `<p class="cmt-top">👑 좋아요 1위 · ${fmt(top.like_count)}<br>${esc(top.text.slice(0, 300))}</p>` : ''}`
}

function commentRow(c) {
  return `<div class="cmt-row">
    <div class="sub">
      <span class="m">👍 ${fmt(c.like_count)}</span>
      ${c.reply_count ? `<span>답글 ${fmt(c.reply_count)}</span>` : ''}
      <span>${day(c.published_at)}</span>
    </div>
    <p>${esc(c.text)}</p>
  </div>`
}

// 복사본은 Claude 에게 통째로 넘겨 분석시키는 용도라, 사람이 읽을 머리말을 붙인다
const COPY_TOP = 30

function commentCopyText(title, videoId, data) {
  const s = data.stats ?? {}
  const lines = [
    `${title} | https://www.youtube.com/watch?v=${videoId}`,
    `상위 댓글 ${Math.min(COPY_TOP, data.rows.length)}개 (총 ${s.total ?? 0}개 수집 · 요청 ${s.requests ?? 0} · 공감 ${s.empathy ?? 0})`,
    ''
  ]
  data.rows.slice(0, COPY_TOP).forEach((c, i) => {
    lines.push(`${i + 1}. (👍 ${c.like_count}${c.reply_count ? ` · 답글 ${c.reply_count}` : ''}) ${c.text.replace(/\s+/g, ' ')}`)
  })
  return lines.join('\n')
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text) } catch {
    const ta = document.createElement('textarea')
    ta.value = text; document.body.appendChild(ta); ta.select()
    document.execCommand('copy'); ta.remove()
  }
}

async function toggleComments(panel, videoId, title) {
  const box = panel.querySelector(`[data-cpanel="${CSS.escape(videoId)}"]`)
  if (!box) return
  if (!box.classList.contains('hide')) {
    box.classList.add('hide'); box.innerHTML = ''; return
  }
  box.classList.remove('hide')
  box.innerHTML = '<p class="muted">댓글 불러오는 중...</p>'

  let data
  try {
    data = await api(`/api/comments?video_id=${encodeURIComponent(videoId)}`)
  } catch (e) { box.innerHTML = `<p class="err">${esc(e.message)}</p>`; return }

  if (!data.ready) {
    box.innerHTML = `<div class="notice">댓글 테이블이 아직 없습니다.
      <b>TODO-SQL.md 0-C</b> 의 SQL 을 실행하면 켜집니다.</div>`
    return
  }
  if (data.rows.length === 0) {
    box.innerHTML = `<p class="muted">아직 수집된 댓글이 없어요.
      <button class="btn btn-sm" data-crefresh="${esc(videoId)}">지금 수집 (1유닛)</button></p>`
  } else {
    box.innerHTML = commentHead(data, videoId) +
      `<div class="cmt-list">${data.rows.map(commentRow).join('')}</div>`
  }

  box.querySelectorAll('[data-ccopy]').forEach((b) => {
    b.onclick = async () => {
      await copyText(commentCopyText(title, videoId, data))
      b.textContent = '✅ 복사됨'
      setTimeout(() => { b.textContent = '📋 댓글 복사' }, 1400)
    }
  })
  box.querySelectorAll('[data-crefresh]').forEach((b) => {
    b.onclick = async () => {
      b.disabled = true
      const face = b.textContent
      b.textContent = '수집 중...'
      try {
        await api('/api/comments/collect', {
          method: 'POST', body: JSON.stringify({ video_id: videoId })
        })
        box.classList.remove('hide')
        box.classList.add('hide') // 토글을 닫았다 다시 열어 새로 그린다
        await toggleComments(panel, videoId, title)
        refreshStatus()
      } catch (e) {
        b.disabled = false
        b.textContent = face
        toast(panel, e.message)
      }
    }
  })
}

// ⚠️🅐 — 교사 신분상 D 채널에 올리기 어려운 주제. 걸러 내지 않고 A 전용으로 표시만 한다.
function sensitiveBadge(v) {
  const hits = v.sensitive ?? []
  if (hits.length === 0) return ''
  const shown = hits.slice(0, 3).join(' · ')
  const more = hits.length > 3 ? ` 외 ${hits.length - 3}` : ''
  return `<span class="m m-sensitive" title="민감 주제 — A(부계정) 전용 · 걸린 말: ${esc(hits.join(', '))}">
    ⚠️🅐 ${esc(shown)}${more}</span>`
}

// 발굴·신작처럼 목록이 긴 화면에서는 낱말 없이 작게만 붙인다
function sensitiveMark(v) {
  const hits = v.sensitive ?? []
  if (hits.length === 0) return ''
  return `<span class="m m-sensitive" title="민감 주제 — A(부계정) 전용 · 걸린 말: ${esc(hits.join(', '))}">🅐</span>`

// ⭐ 후보 / ❤️ 확정. ❤️ 를 다시 누르면 ⭐ 로 내린다.

      aria-label="확정" title="${lv >= 2 ? '확정 해제 (⭐ 후보로)' : '❤️ 확정으로 올리기'}">${lv >= 2 ? '❤️' : '🤍'}</button>`

// 목록을 그린 뒤 공통 버튼(⭐ / 🔎 관련 / 아이디어로)을 붙인다
// 행과 그 아래 붙은 관련주제 패널을 함께 접어 없앤다 (낙관적 업데이트)
function dropRow(el) {
  const row = el.closest('.row')
  if (!row) return null
  // 행 뒤에 붙는 패널(관련 주제·댓글)도 같이 접는다
  const panels = []
  for (let n = row.nextElementSibling; n; n = n.nextElementSibling) {
    if (!n.classList.contains('relpanel') && !n.classList.contains('cmtpanel')) break
    panels.push(n)
  }
  const restore = { row, panels, display: row.style.display }
  row.style.display = 'none'
  panels.forEach((p) => { p.style.display = 'none' })
  return restore
}

function undropRow(restore) {
  if (!restore) return
  restore.row.style.display = restore.display
  restore.panels.forEach((p) => { p.style.display = '' })
}

// 태그 한 줄은 자기 자신만 다시 그린다. 목록 전체를 render() 하면
// 스크롤 위치와 입력 포커스가 날아가 연달아 태그를 붙이기 어렵다.
function wireConceptTags(panel, box) {
  if (!box) return
  const videoId = box.dataset.ctags
  const input = box.querySelector('.ctag-in')
  const shown = () => [...box.querySelectorAll('[data-ctag-go]')].map((c) => c.dataset.ctagGo)

  const save = async (tags, keepFocus) => {
    let data
    try {
      data = await api('/api/pick', {
        method: 'POST', body: JSON.stringify({ video_id: videoId, concept_tags: tags })
      })
    } catch (e) { toast(panel, e.message); return }

    // 서버가 정리한 결과(공백·중복·개수 제한)를 그대로 되받아 다시 그린다
    const saved = data.concept_tags ?? []
    box.outerHTML = conceptTags({ video_id: videoId, concept_tags: saved })
    const fresh = panel.querySelector(`[data-ctags="${CSS.escape(videoId)}"]`)
    wireConceptTags(panel, fresh)

    const idea = fresh?.closest('.row')?.querySelector('.idea')
    if (idea) idea.dataset.tags = saved.join(',')
    if (keepFocus) fresh?.querySelector('.ctag-in')?.focus()
  }

  // 쉼표로 여러 개를 한 번에. Enter 로도, 다른 곳을 눌러도 저장된다.
  const add = (keepFocus) => {
    const raw = input.value.trim()
    if (!raw) return
    input.value = '' // Enter 로 이미 저장한 것을 blur 가 또 저장하지 않게
    save([...shown(), ...raw.split(',')], keepFocus)
  }

  input.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); add(true) } }
  input.onblur = () => add(false)

  box.querySelectorAll('[data-ctag-del]').forEach((b) => {
    b.onclick = () => save(shown().filter((t) => t !== b.dataset.ctagDel), false)
  })
  box.querySelectorAll('[data-ctag-go]').forEach((b) => {
    b.onclick = () => toggleRelated(panel, videoId, b.dataset.ctagGo)
  })
}

function wireRows(panel) {
  panel.querySelectorAll('.ctags').forEach((box) => wireConceptTags(panel, box))

  // 발굴·신작 등 목록의 ★ — 누르면 후보로 담고 그 자리에서 사라진다
  panel.querySelectorAll('[data-star]').forEach((b) => {
    b.onclick = async () => {
      const hidden = showPicked ? null : dropRow(b)
      b.classList.add('star-on')
      try {
        await api('/api/pick', {
          method: 'POST',
          body: JSON.stringify({ video_id: b.dataset.star, level: 1 })
        })
        bumpCount(panel, -1)
      } catch (e) {
        undropRow(hidden)
        b.classList.remove('star-on')
        toast(panel, e.message)
      }
    }
  })

  // 후보함의 ⭐/❤️ — data-pick="video_id|목표레벨"
  panel.querySelectorAll('[data-pick]').forEach((b) => {
    b.onclick = async () => {
      const [videoId, next] = b.dataset.pick.split('|')
      const level = Number(next)
      const hidden = level === 0 ? dropRow(b) : null
      try {
        await api('/api/pick', {
          method: 'POST', body: JSON.stringify({ video_id: videoId, level })
        })
        if (level === 0) bumpCount(panel, -1)
        else render() // ⭐↔❤️ 는 정렬이 바뀌므로 다시 그린다
      } catch (e) {
        undropRow(hidden)
        toast(panel, e.message)
      }
    }
  })

  // 용도 칩 — 이미 켜진 것을 다시 누르면 미지정으로
  panel.querySelectorAll('[data-target-set]').forEach((b) => {
    b.onclick = async () => {
      const [videoId, letter] = b.dataset.targetSet.split('|')
      const on = b.classList.contains('tchip-on')
      const value = on ? null : letter
      const group = b.parentElement
      group.querySelectorAll('.tchip').forEach((c) => c.classList.remove('tchip-on'))
      if (!on) b.classList.add('tchip-on')
      group.querySelector('.tchip-none')?.remove()

      // 복사 버튼이 쓰는 값도 같이 맞춰 둔다
      const idea = b.closest('.row')?.querySelector('.idea')
      if (idea) idea.dataset.target = value ?? ''

      try {
        await api('/api/pick', {
          method: 'POST', body: JSON.stringify({ video_id: videoId, target_group: value })
        })
      } catch (e) { toast(panel, e.message); render() }
    }
  })

  panel.querySelectorAll('.idea').forEach((b) => {
    b.onclick = async () => {
      const text = ideaText(b)
      try { await navigator.clipboard.writeText(text) } catch {
        const ta = document.createElement('textarea')
        ta.value = text; document.body.appendChild(ta); ta.select()
        document.execCommand('copy'); ta.remove()
      }
      b.innerHTML = '✅<span class="lbl"> 복사됨</span>'
      setTimeout(() => { b.innerHTML = IDEA_FACE }, 1400)
    }
  })

  panel.querySelectorAll('[data-rel]').forEach((b) => {
    b.onclick = () => toggleRelated(panel, b.dataset.rel)
  })

  // [⋯] — 그 행의 상세 줄만 여닫는다. 목록을 다시 그리지 않으므로 스크롤이 튀지 않는다.
  panel.querySelectorAll('[data-more]').forEach((b) => {
    b.onclick = () => {
      const box = panel.querySelector(`[data-det="${CSS.escape(b.dataset.more)}"]`)
      if (!box) return
      const closed = box.classList.toggle('hide')
      b.setAttribute('aria-expanded', String(!closed))
      b.title = closed ? '상세 지표와 추가 동작 펼치기' : '상세 접기'
    }
  })

  // 🤖 예심 통과 — 승격/제외. 둘 다 그 자리에서 행이 사라진다.
  panel.querySelectorAll('[data-promote]').forEach((b) => {
    b.onclick = async () => {
      const hidden = dropRow(b)
      try {
        await api('/api/pick', {
          method: 'POST', body: JSON.stringify({ video_id: b.dataset.promote, level: 1 })
        })
        bumpPending(panel, -1)
        render()
      } catch (e) { undropRow(hidden); toast(panel, e.message) }
    }
  })
  panel.querySelectorAll('[data-drop]').forEach((b) => {
    b.onclick = async () => {
      const hidden = dropRow(b)
      try {
        await api('/api/pick', {
          method: 'POST', body: JSON.stringify({ video_id: b.dataset.drop, excluded: true })
        })
        bumpPending(panel, -1)
      } catch (e) { undropRow(hidden); toast(panel, e.message) }
    }
  })

  // 🤔 킵 / ↩ 대기로 — 칸을 옮기는 것이라 옮긴 뒤 다시 그린다
  const moveKept = (sel, kept) => {
    panel.querySelectorAll(sel).forEach((b) => {
      const id = kept ? b.dataset.keep : b.dataset.unkeep
      b.onclick = async () => {
        const hidden = dropRow(b)
        try {
          await api('/api/pick', {
            method: 'POST', body: JSON.stringify({ video_id: id, kept })
          })
          if (kept) bumpPending(panel, -1)
          render()
        } catch (e) { undropRow(hidden); toast(panel, e.message) }
      }
    })
  }
  moveKept('[data-keep]', true)
  moveKept('[data-unkeep]', false)

  panel.querySelectorAll('[data-cmt]').forEach((b) => {
    b.onclick = () => toggleComments(panel, b.dataset.cmt, b.dataset.title)
  })
}

async function toggleRelated(panel, videoId, keyword) {
  const box = panel.querySelector(`[data-panel="${CSS.escape(videoId)}"]`)
  if (!box) return
  if (!box.classList.contains('hide') && keyword === undefined) {
    box.classList.add('hide'); box.innerHTML = ''; return
  }
  box.classList.remove('hide')
  box.innerHTML = '<p class="muted">관련 주제 찾는 중...</p>'

  const qs = keyword !== undefined ? `&q=${encodeURIComponent(keyword)}` : ''
  const data = await api(`/api/related?video_id=${encodeURIComponent(videoId)}${qs}`)
  drawRelated(box, panel, videoId, data)
}

function drawRelated(box, panel, videoId, data) {
  box.innerHTML = `
    <div class="rel-head">
      <input class="rel-kw" value="${esc(data.keyword || '')}" placeholder="키워드">
      <button class="btn btn-sm rel-go">DB에서 찾기</button>
      <button class="btn-ghost btn-sm rel-yt">유튜브 전체에서 찾기 (할당량 100유닛 사용)</button>
    </div>
    ${data.keywords?.length ? `<div class="rel-kws">${data.keywords.map((k) => `<button class="chip-kw">${esc(k)}</button>`).join('')}</div>` : ''}
    ${data.results.length ? data.results.map((v) => `
      <div class="rel-row">
        <a href="https://www.youtube.com/watch?v=${esc(v.video_id)}" target="_blank" rel="noopener noreferrer">${esc(v.title)}</a>
        <div class="sub">
          <span>${esc(v.channel_title || '')}</span>
          <span>조회 ${fmt(v.views)}</span>
          <span>${day(v.published_at)}</span>
          <span class="m">x${(v.multiple ?? 0).toFixed(1)}</span>
        </div>
      </div>`).join('')
      : '<p class="muted">DB 안에는 관련 영상이 없어요. 유튜브 전체에서 찾아보세요.</p>'}
    <p class="rel-msg muted"></p>
  `
  const kwInput = box.querySelector('.rel-kw')
  box.querySelector('.rel-go').onclick = () => toggleRelated(panel, videoId, kwInput.value)
  kwInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') toggleRelated(panel, videoId, kwInput.value) })
  box.querySelectorAll('.chip-kw').forEach((c) => {
    c.onclick = () => toggleRelated(panel, videoId, c.textContent)
  })
  box.querySelector('.rel-yt').onclick = async (e) => {
    const btn = e.currentTarget
    btn.disabled = true; btn.textContent = '검색 중...'
    try {
      const r = await api('/api/related/search', {
        method: 'POST',
        body: JSON.stringify({ q: kwInput.value, video_id: videoId })
      })
      drawRelated(box, panel, videoId, { ...r, keywords: [] })
      box.querySelector('.rel-msg').textContent = `${r.saved}건 저장 · 약 ${r.units}유닛 사용`
    } catch (err) {
      btn.disabled = false
      btn.textContent = '유튜브 전체에서 찾기 (할당량 100유닛 사용)'
      box.querySelector('.rel-msg').textContent = err.message
    }
  }
}

const BADGE_CLASS = { short: 'b-short', mid: 'b-mid', long: 'b-long', pending: 'b-pending' }

// ---------------------------------------------------------------- 탭 · 갱도 이동

// 브리핑의 "전체 보기 →" 와 갱도 칩이 함께 쓴다. 탭을 옮기면 위로 올려 준다 —
// 아래쪽을 보다 넘어가면 새 화면의 한가운데에 떨어져 무슨 화면인지 모른다.
function goTab(next, nextShaft) {
  tab = next
  if (nextShaft) shaft = nextShaft
  window.scrollTo({ top: 0, behavior: 'smooth' })
  renderTabs()
  render()
}

// 광산 갱도 — 예전 발굴·신작·HOT 탭이 여기로 들어왔다.
// 급상승은 설정을 켠 사람만 쓰던 탭이라, 켜져 있을 때만 칩이 하나 더 붙는다.
function shaftDefs() {
  return [
    ['dig', '💎 묵은 검증', '게시 6개월~3년 중 배율이 터진 영상'],
    ['fresh', '📡 신작', '감시 채널이 최근 30일에 올린 영상'],
    ['hot', '🔥 HOT', '감시망 밖 트렌드 — 뜨는 주제·추천 채널·해외 광맥·휴면 광산'],
    ...(settings.trendingOn ? [['discover', '🔥 급상승', '유튜브 인기 급상승(mostPopular) 수집분']] : [])
  ]
}

function shaftBar() {

    ${shaftDefs().map(([k, t, tip]) => `<button class="shaft ${shaft === k ? 'shaft-on' : ''}"
      data-shaft="${k}" title="${esc(tip)}">${t}</button>`).join('')}

function wireShafts(panel) {
  panel.querySelectorAll('[data-shaft]').forEach((b) => {
    b.onclick = () => { shaft = b.dataset.shaft; render() }
  })
}

const inShaft = (s) => tab === 'mine' && shaft === s

// ---------------------------------------------------------------- 📥 브리핑
// 들어오자마자 '오늘 뭘 하면 되는지' 만 본다. 목록을 다시 보여 주는 자리가 아니라,
// 각 칸이 해당 탭으로 보내는 표지판이다.

const WEEK_MS = 7 * 864e5

// '이번 주 주목' — 이번 주에 담은 것 중 배율 상위 3. 이번 주에 담은 게 없으면
// 후보함 전체에서 상위 3 을 보여 주고 그렇다고 밝힌다 (빈 칸으로 두면 후보함을 잊는다).
function briefWatch(rows) {
  const fresh = rows.filter((v) => v.starred_at && Date.now() - new Date(v.starred_at).getTime() < WEEK_MS)
  const pool = fresh.length ? fresh : rows
  return {
    note: fresh.length ? '이번 주 담은 것 중 배율 상위' : '이번 주 담은 게 없어 후보함 전체 상위',
    rows: [...pool].sort((a, b) => (Number(b.multiple) || 0) - (Number(a.multiple) || 0)).slice(0, 3)
  }
}

function briefHotLines(h) {
  const seen = h.last_prospect_at ? day(h.last_prospect_at) : '아직 없음'
  return `
    🔥 지금 뜨는 주제 <b>${fmt(h.trending?.length ?? 0)}건</b>
      <span class="muted">최근 90일 · 배율·침투 상위</span><br>
    📺 추천 채널 <b>${fmt(h.channels?.length ?? 0)}개</b> ·
      🌍 해외 광맥 <b>${fmt(h.global?.length ?? 0)}건</b><br>
    💀 휴면 광산 <b>${fmt(h.dormant?.length ?? 0)}개</b> ·
      마지막 탐사 <b>${esc(seen)}</b>`
}

// ---------------------------------------------------------------- 📡 신작 걸러내기
// 신작은 감시 채널이 올린 것을 전부 받아 온다. 그대로 펴 두면 한 채널이 하루에 다섯 개를
// 올린 날 목록이 그 채널로 덮여, 다른 채널의 신호가 묻힌다.
// 기본값('신호만')이 하는 일은 둘뿐이다 —
//   ① 배율 등급 Low(그 채널 평소보다 못 터진 영상)를 감춘다
//   ② 채널당 ${FRESH_PER_CHANNEL}건까지만 펴고 나머지는 그 자리에 접어 둔다
// 발굴 갱도는 이미 점수순이라 이 체를 걸지 않는다.
function signalToggle() {
  return `<div class="fmt" role="group" aria-label="신작 걸러내기">
    <button class="fmt-b ${freshSignalOnly ? 'fmt-on' : ''}" data-sig="1"
      title="Low 등급을 감추고 채널당 ${FRESH_PER_CHANNEL}건까지만 폅니다">신호만</button>
    <button class="fmt-b ${freshSignalOnly ? '' : 'fmt-on'}" data-sig="0"
      title="받은 것을 그대로 다 보여줍니다">전부</button>
  </div>`
}

function wireSignalToggle(panel) {
  panel.querySelectorAll('[data-sig]').forEach((b) => {
    b.onclick = () => { freshSignalOnly = b.dataset.sig === '1'; render() }
  })
}

function freshSieve(rows) {
  const rowHtml = (v) => videoRow(v, metricBadges(v), { idea: true })
  if (!freshSignalOnly) return { html: rows.map(rowHtml).join(''), hiddenLow: 0, folded: 0 }

  const kept = rows.filter((v) => v.grade?.multiple !== 'low')
  const out = []
  const seen = new Map() // 채널별로 몇 번째인지
  const over = new Map() // 채널별로 접어 둘 나머지
  for (const v of kept) {
    const key = v.channel_id || v.channel_title || '?'
    const n = (seen.get(key) ?? 0) + 1
    seen.set(key, n)
    if (n <= FRESH_PER_CHANNEL) {
      out.push(rowHtml(v))
      // 마지막으로 편 행의 자리를 기억해 둔다 — 접은 묶음은 그 바로 아래에 놓는다
      if (n === FRESH_PER_CHANNEL) {
        over.set(key, { at: out.length - 1, label: v.channel_title || '', rows: [] })
      }
    } else {
      over.get(key).rows.push(v)
    }
  }
  // 뒤에서부터 끼워 넣어야 앞쪽 자리 번호가 밀리지 않는다
  const folds = [...over.values()].filter((o) => o.rows.length).sort((a, b) => b.at - a.at)
  folds.forEach((o) => out.splice(o.at + 1, 0, `
    <details class="more-ch">
      <summary>이 채널 ${fmt(o.rows.length)}건 더 <span class="muted">${esc(o.label)}</span></summary>
      ${o.rows.map(rowHtml).join('')}
    </details>`))

  return {
    html: out.join(''),
    hiddenLow: rows.length - kept.length,
    folded: folds.reduce((a, o) => a + o.rows.length, 0)
  }
}

// ---------------------------------------------------------------- ⚙️ 관리 안쪽 섹션
// 추적 중·주간 리포트는 예전에 각자 탭이었다. 매일 볼 것은 아니라 관리 탭 안에 접어 두고,
// 실제로 펼 때만 부른다 — 주간 리포트의 '열 때만 계산한다' 는 성질도 그대로 지켜진다.

function lazySection(id, title, note) {
  return `<details class="sec-box" data-lazy="${id}">
    <summary>${title} <span class="muted">${esc(note)}</span></summary>
    <div class="sec-body"><p class="muted">불러오는 중…</p></div>

}

// 섹션마다 자기 토글을 가진다 — 두 섹션을 동시에 펴도 id 가 겹치지 않는다
function pickedToggleFor(kind) {
  return `<div class="filters"><button class="btn-ghost btn-sm ${showPicked ? 'fmt-on' : ''}"
    data-picked-sec="${kind}" title="담아 둔 영상까지 함께 보기">⭐ 포함 보기</button></div>`

function wireSectionPicked(box) {

async function fillTracking(box) {

  wireSectionPicked(box)

async function fillWeekly(box) {
  const w = await api(`/api/weekly?${pq()}`)
  const list = (rows, empty) => rows.length
    ? rows.map((v) => videoRow(v, metricBadges(v), { idea: true })).join('')
    : `<p class="empty">${empty}</p>`
  box.innerHTML = `
    ${pickedToggleFor('weekly')}
    <p class="muted" style="margin-top:0">
      ${day(w.since)} ~ 오늘 (7일) · ⭐ 전체 ${fmt(w.starred.total)}건
      <b>이번 주 +${fmt(w.starred.this_week)}</b>

}

const LAZY = { tracking: fillTracking, weekly: fillWeekly }

function wireLazy(panel) {
  panel.querySelectorAll('[data-lazy]').forEach((d) => {
    d.ontoggle = async () => {
      if (!d.open || d.dataset.done) return
      d.dataset.done = '1' // 접었다 다시 펴도 또 부르지 않는다
      const box = d.querySelector('.sec-body')
      try {
        await LAZY[d.dataset.lazy](box)
      } catch (e) {
        d.dataset.done = '' // 실패했으면 다음에 다시 시도할 수 있어야 한다
        box.innerHTML = `<p class="err">${esc(e.message)}</p>`
      }
    }
  })
}

// 마지막 수집·할당량은 늘 적고, 경고는 이상할 때만 붙인다.
// 평소에도 빨간 글자가 있으면 진짜 이상할 때 눈에 안 들어온다.
function briefStatusLine(s) {
  if (!s) return '<p class="blines bstat muted">상태를 읽지 못했어요.</p>'
  const at = s.last_run
    ? new Date(s.last_run.at).toLocaleString('ko-KR',
        { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })
    : '없음'
  const pct = Math.min(100, Math.round((s.units_today / s.quota_limit) * 100))
  const warn = []
  if (s.last_run?.aborted === 'quota') {
    warn.push('<b class="wa">할당량 초과로 중단</b> <span class="muted">태평양 자정 리셋 후 재시도</span>')
  } else if (pct >= 70) {
    warn.push(`<b class="wa">할당량 ${pct}% 사용</b>`)
  }
  if (s.last_run?.errors) warn.push(`<b class="wa">최근 수집 오류 ${fmt(s.last_run.errors)}건</b>`)
  return `<p class="blines bstat">⏱ 마지막 수집 <b>${esc(at)}</b> ·
    ⚡ 오늘 <b>${fmt(s.units_today)}</b>/${fmt(s.quota_limit)}유닛${
      warn.length ? ` · ${warn.join(' · ')}` : ''}</p>`
}
