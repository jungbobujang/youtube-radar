            toast(panel, r.backlog_only
              ? '다음 수집부터 과거 영상을 캐 옵니다 — 💎 묵은 검증 갱도에 합류합니다.'
              : 'backlog_only 컬럼이 없어 일반 감시로 넣었어요 (TODO-SQL.md 0-H).')
            if (r.group_error) toast(panel, `그룹 배정 실패 — ${r.group_error}`)
          } catch (e) {
            b.disabled = false
            b.textContent = '⛏ 백카탈로그 채굴'
            toast(panel, e.message)
          }
        }
      })
      $('#hot-go').onclick = async () => {
        const b = $('#hot-go')
        b.disabled = true
        b.textContent = '탐사 중... (1~2분)'
        $('#hot-err').textContent = ''
        try {
          const r = await api('/api/hot/prospect', { method: 'POST', body: JSON.stringify({}) })
          toast(panel, `탐사 완료 — 영상 ${fmt(r.saved)}건 · ${fmt(r.units)}유닛`)
          refreshStatus()
          render()
        } catch (e) {
          $('#hot-err').textContent = e.message
          b.disabled = false
          b.innerHTML = `🔥 지금 탐사 <span class="muted">(약 ${fmt(h.cost)}유닛)</span>`
        }
      }
      return
    }

    // 탭 버튼이 없는 옛 화면. /api/radar 를 살려 두려고 분기만 남긴다.
    if (tab === 'radar') {
      const rows = await api(`/api/radar?${pq()}`)
      panel.innerHTML = `
        <div class="filters">
          <span class="muted" data-count="${rows.length}">${rows.length}건</span>
          ${pickedToggle()}
        </div>
        ${rows.length
          ? rows.map((v) => videoRow(v, `
              ${v.hits?.length ? `<span class="hits">${v.hits.map(esc).join(' · ')}</span>` : ''}
              <span class="badge b-score">${v.score}점</span>
            `, { noMore: true })).join('')
          : `<p class="empty">조건에 맞는 영상이 아직 없어요.
               <b>⚙️ 관리</b>에서 관심 키워드나 채널을 등록해 보세요.</p>`}
      `
      wireRows(panel)
      wirePickedToggle()
      return
    }

    if (inShaft('discover')) {
      const rows = await api(`/api/discover?${pq()}`)
      panel.innerHTML = `
        ${shaftBar()}
        <div class="filters">
          <span class="muted" data-count="${rows.length}">${rows.length}건</span>
          ${pickedToggle()}
        </div>
        ${rows.length
          ? rows.map((v) => videoRow(v, '', { noMore: true })).join('')
          : '<p class="empty">아직 수집된 영상이 없어요. [지금 수집]을 눌러 보세요.</p>'}
      `
      wireShafts(panel)
      wireRows(panel)
      wirePickedToggle()
      return
    }

    const { watches, lastRun, growth, dormancy } = await api('/api/watches')
    // 표가 아직 없으면 조용히 빈 목록 (SQL 미실행 상태에서도 화면은 그대로 돈다)
    const dismissals = await api('/api/hot/dismissals')
      .then((r) => r.rows ?? [])
      .catch(() => [])
    const { groups, links } = await api('/api/groups')
    settings.groups = groups

    const of = (t) => watches.filter((w) => w.type === t)
    const chCount = of('channel').length
    const kwCount = of('keyword').filter((w) => w.active).length
    const pickedCats = of('category').map((w) => String(w.value))

    const memberOf = (watchId) => new Set(links.filter((l) => l.watch_id === watchId).map((l) => l.group_id))

    // 채널을 그룹별로 묶는다. 여러 그룹에 속하면 각 섹션에 모두 나온다.
    const grouped = new Set()
    const sections = groups.map((g) => {
      const items = of('channel').filter((w) => memberOf(w.id).has(g.id))
      items.forEach((w) => grouped.add(w.id))
      return { group: g, items }
    })
    sections.push({ group: null, items: of('channel').filter((w) => !grouped.has(w.id)) })

    const chipList = (type, icon) => of(type).length
      ? of(type).map((w) => `
          <span class="kw ${w.active ? '' : 'off'}">
            ${icon} ${esc(w.value)}
            <button data-del="${w.id}" aria-label="삭제">✕</button>
          </span>`).join('')
      : '<span class="empty">없음</span>'

    panel.innerHTML = `
      ${lazySection('weekly', '📊 주간 리포트', '지난 7일 요약 · 펼칠 때만 계산')}
      ${lazySection('tracking', '📈 추적 중', '수집된 영상의 조회수 증가 추이')}

      <div class="notice">
        <b>API 할당량</b> — YouTube Data API는 하루 10,000 유닛입니다.
        채널 수집은 <b>업로드 재생목록 방식</b>이라 채널당 회당 <b>2~3유닛</b>만 씁니다
        (재생목록 1 + 상세 1, 최초 1회만 채널조회 1).
        <b>실측: 채널 ${chCount}개 + 백카탈로그 포함 1회 302유닛, 하루 8회 약 ${fmt(302 * 8)}유닛.</b>
        백카탈로그가 다 차면 회당 40유닛대로 떨어집니다.
        <br>키워드 감시만 <b>search.list 100유닛</b>을 쓰므로 개수를 조심하세요 (현재 ${kwCount}개).
        관심/제외 키워드·카테고리·그룹은 추가 호출 없이 분류에만 쓰여 할당량과 무관합니다.
      </div>

      <h3 class="sec">📁 채널 그룹</h3>
      <div class="gm">
        ${(settings.groups ?? []).map((g) => `
          <span class="kw">
            <button class="gm-icon" data-gicon="${esc(g.id)}" title="아이콘 변경">${esc(g.icon)}</button>
            <input class="gm-name" data-gname="${esc(g.id)}" value="${esc(g.name)}">
            <button data-gdel="${esc(g.id)}" aria-label="그룹 삭제">✕</button>
          </span>`).join('') || '<span class="empty">그룹이 없어요</span>'}
      </div>
      <div class="form">
        <input id="g-name" placeholder="새 그룹 이름">
        <button class="btn btn-sm" id="g-add">그룹 추가</button>
      </div>
      <p class="muted">그룹을 지워도 채널은 남고 연결만 끊깁니다.</p>

      <h3 class="sec">🔥 급상승 수집</h3>
      <label class="cat">
        <input type="checkbox" id="s-trending" ${settings.trendingOn ? 'checked' : ''}>
        인기 급상승(mostPopular)도 함께 수집 — 기본은 꺼짐
      </label>
      <p class="muted">채널 백카탈로그 발굴이 주 전략이라 기본값은 off 입니다.</p>

      <h3 class="sec">🔥 HOT 주간 탐사</h3>
      <label class="cat">
        <input type="checkbox" id="s-hot" ${settings.hotWeeklyOn ? 'checked' : ''}>
        일요일 저녁마다 감시망 밖(국내·해외)을 한 번 훑기 — 기본은 켜짐
      </label>
      <p class="muted">
        검색 1건당 100유닛이라 주 1회만 돕니다. 급할 때는 <b>💎 광산 › 🔥 HOT</b> 갱도의
        <b>지금 탐사</b> 버튼을 쓰세요.
      </p>

      <h3 class="sec">⛏ 새 광맥 자동 탐사</h3>
      <label class="cat">
        <input type="checkbox" id="s-prospect" ${settings.prospectOn ? 'checked' : ''}>
        정규 수집 때 키워드 검색도 함께 — 기본은 꺼짐
      </label>
      <p class="muted">
        키워드 검색은 <b>1건당 100유닛</b>이라 하루 2회 수집에서 가장 많이 먹습니다.
        평소엔 꺼 두고 아래 버튼으로 필요할 때만 돌리세요.
        <button class="btn btn-sm" id="prospect-now">🔎 지금 탐사</button>
      </p>
      <p class="err" id="prospect-err"></p>

      <h3 class="sec">🔍 수집 대상 <span class="muted">(할당량 소모)</span></h3>
      <div class="form">
        <select id="w-type">
          <option value="keyword">키워드 검색</option>
          <option value="channel">채널</option>
        </select>
        <input id="w-value" placeholder="검색어 또는 채널 URL / @핸들 / 채널 ID">
        <button class="btn btn-sm" id="w-add">추가</button>
      </div>
      <p class="err" id="w-err"></p>
      ${of('keyword').map((w) => `
        <div class="row ${w.active ? '' : 'off'}">
          <div class="meta">
            <span class="title">🔍 ${esc(w.label || w.value)}</span>
            <div class="sub"><span>${esc(w.value)}</span></div>
          </div>
          <button class="btn-ghost btn-sm" data-toggle="${w.id}">${w.active ? '끄기' : '켜기'}</button>
          <button class="btn-ghost btn-sm" data-del="${w.id}">삭제</button>
        </div>
      `).join('')}

      ${sections.map(({ group, items }) => `
        <h3 class="sec">${group ? `${esc(group.icon)} ${esc(group.name)}` : '📂 미분류'}
          <span class="muted">${items.length}개</span></h3>
        ${items.length ? items.map((w) => `
          <div class="row ${w.active ? '' : 'off'}">
            <div class="meta">
              <span class="title">${dormancy?.[w.value] ? dormantMark(dormancy[w.value].level) : '📺'} ${esc(w.label || w.value)}${w.backlog_only ? ' <span class="muted">⛏ 과거만</span>' : ''}</span>
              <div class="gchips">
                ${dormantBadge(dormancy?.[w.value])}
                ${growthChip(growth?.[w.value])}
                ${(settings.groups ?? []).map((g) => `
                  <button class="chip-g ${memberOf(w.id).has(g.id) ? 'chip-g-on' : ''}"
                          data-wg="${esc(w.id)}|${esc(g.id)}">${esc(g.icon)}</button>`).join('')}
                <select class="fmt-ov" data-fmtov="${esc(w.id)}">
                  ${[['', '자동'], ['long', '항상 롱폼'], ['shorts', '항상 쇼츠']]
                    .map(([v, t]) => `<option value="${v}" ${(w.format_override || '') === v ? 'selected' : ''}>${t}</option>`).join('')}
                </select>
              </div>
            </div>
            <button class="btn-ghost btn-sm" data-toggle="${w.id}">${w.active ? '끄기' : '켜기'}</button>
            <button class="btn-ghost btn-sm" data-del="${w.id}">삭제</button>
          </div>`).join('') : '<p class="empty">없음</p>'}
      `).join('')}

      ${dismissals.length ? `
        <details class="dis-box">
          <summary>🚫 관심없음 목록 <span class="muted">(${dismissals.length})</span></summary>
          <p class="muted" style="margin:6px 0 8px">
            추천 채널·휴면 광산에서 빠져 있습니다. 해제 예정일이 지나면 자동으로 다시 올라옵니다.
          </p>
          ${dismissals.map((d) => `
            <div class="row dis-row">
              <div class="meta">
                <span class="title">🚫 ${esc(d.channel_title || d.channel_id)}</span>
                <div class="sub">
                  <span>${untilLabel(d.until)}</span>
                  <span class="muted">${d.channel_title ? esc(d.channel_id) : ''}</span>
                </div>
              </div>
              <button class="btn-ghost btn-sm" data-undismiss="${esc(d.channel_id)}">지금 해제</button>
            </div>`).join('')}
        </details>` : ''}

      <h3 class="sec">🎯 관심 키워드 <span class="muted">(제목에 걸리면 +30점)</span></h3>
      <div class="form">
        <input id="inc-value" placeholder="예: 자기계발">
        <button class="btn btn-sm" id="inc-add">추가</button>
      </div>
      <div class="kws">${chipList('include_kw', '🎯')}</div>

      <h3 class="sec">🚫 제외 키워드 <span class="muted">(걸리면 화면에서 숨김)</span></h3>
      <div class="form">
        <input id="exc-value" placeholder="예: 먹방">
        <button class="btn btn-sm" id="exc-add">추가</button>
      </div>
      <div class="kws">${chipList('exclude_kw', '🚫')}</div>

      <h3 class="sec">📂 카테고리 필터 <span class="muted">(선택 시 급상승은 이 안에서만)</span></h3>
      <div class="cats">
        ${YT_CATEGORIES.map((c) => `
          <label class="cat">
            <input type="checkbox" data-cat="${c.id}" ${pickedCats.includes(c.id) ? 'checked' : ''}>
            ${esc(c.name)}
          </label>`).join('')}
      </div>
      <p class="muted">아무것도 선택하지 않으면 급상승 전체를 봅니다.</p>

      <p class="muted" style="margin-top:14px">
        ${lastRun ? `최근 수집 ${new Date(lastRun.at).toLocaleString('ko-KR')} · 급상승 ${lastRun.trending}건 · 감시 ${lastRun.watches}건${lastRun.errors?.length ? ` · 오류 ${lastRun.errors.length}건` : ''}${lastRun.aborted === 'quota' ? ' · <b>할당량 초과로 중단 (다음 주기에 재시도)</b>' : ''}` : '아직 수집 기록이 없어요.'}
      </p>
    `

    wireLazy(panel)

    const add = async (type, value) => {
      if (!value) return
      try {
        await api('/api/watches', { method: 'POST', body: JSON.stringify({ type, value }) })
        render()
      } catch (e) { $('#w-err').textContent = e.message }
    }

    // 그룹 관리
    $('#g-add').onclick = async () => {
      const name = $('#g-name').value.trim()
      if (!name) return
      await api('/api/groups', { method: 'POST', body: JSON.stringify({ name }) })
      render()
    }
    panel.querySelectorAll('[data-gname]').forEach((inp) => {
      inp.onblur = async () => {
        await api(`/api/groups/${inp.dataset.gname}`, {
          method: 'PATCH', body: JSON.stringify({ name: inp.value })
        })
      }
      inp.onkeydown = (e) => { if (e.key === 'Enter') inp.blur() }
    })
    panel.querySelectorAll('[data-gicon]').forEach((b) => {
      b.onclick = async () => {
        const icon = prompt('그룹 아이콘 (이모지 1자)', b.textContent.trim())
        if (!icon) return
        await api(`/api/groups/${b.dataset.gicon}`, {
          method: 'PATCH', body: JSON.stringify({ icon })
        })
        render()
      }
    })
    panel.querySelectorAll('[data-gdel]').forEach((b) => {
      b.onclick = async () => {
        if (!confirm('이 그룹을 삭제할까요? 채널은 남고 연결만 끊깁니다.')) return
        await api(`/api/groups/${b.dataset.gdel}`, { method: 'DELETE' })
        render()
      }
    })
    panel.querySelectorAll('[data-fmtov]').forEach((sel) => {
      sel.onchange = async () => {
        await api(`/api/watches/${sel.dataset.fmtov}`, {
          method: 'PATCH', body: JSON.stringify({ format_override: sel.value })
        })
      }
    })
    panel.querySelectorAll('[data-wg]').forEach((b) => {
      b.onclick = async () => {
        const [watchId, groupId] = b.dataset.wg.split('|')
        const on = !b.classList.contains('chip-g-on')
        b.classList.toggle('chip-g-on', on)
        await api('/api/watch-groups', {
          method: 'POST', body: JSON.stringify({ watch_id: watchId, group_id: groupId, on })
        })
        render()
      }
    })

    $('#s-trending').onchange = async (e) => {
      settings = { ...settings, ...await api('/api/settings/trending', {
        method: 'POST', body: JSON.stringify({ on: e.target.checked })
      }) }
      renderTabs()
    }
    $('#s-hot').onchange = async (e) => {
      settings = { ...settings, ...await api('/api/settings/hot-weekly', {
        method: 'POST', body: JSON.stringify({ on: e.target.checked })
      }) }
    }
    $('#s-prospect').onchange = async (e) => {
      settings = { ...settings, ...await api('/api/settings/prospect', {
        method: 'POST', body: JSON.stringify({ on: e.target.checked })
      }) }
    }
    $('#prospect-now').onclick = async (e) => {
      const b = e.target
      b.disabled = true
      const face = b.textContent
      b.textContent = '탐사 중...'
      $('#prospect-err').textContent = ''
      try {
        const r = await api('/api/prospect', { method: 'POST' })
        b.textContent = `✅ ${fmt(r.videos ?? 0)}건 · ${fmt(r.units ?? 0)}유닛`
        refreshStatus()
      } catch (err) {
        $('#prospect-err').textContent = err.message
        b.textContent = face
      } finally {
        b.disabled = false
      }
    }
    $('#w-add').onclick = () => add($('#w-type').value, $('#w-value').value.trim())
    $('#inc-add').onclick = () => add('include_kw', $('#inc-value').value.trim())
    $('#exc-add').onclick = () => add('exclude_kw', $('#exc-value').value.trim())
    $('#inc-value').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#inc-add').click() })
    $('#exc-value').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#exc-add').click() })

    panel.querySelectorAll('[data-cat]').forEach((box) => {
      box.onchange = async () => {
        const id = box.dataset.cat
        const existing = of('category').find((w) => String(w.value) === id)
        if (box.checked && !existing) await add('category', id)
        else if (!box.checked && existing) {
          await api(`/api/watches/${existing.id}`, { method: 'DELETE' })
          render()
        }
      }
    })
    panel.querySelectorAll('[data-toggle]').forEach((b) => {
      b.onclick = async () => { await api(`/api/watches/${b.dataset.toggle}/toggle`, { method: 'POST' }); render() }
    })
    panel.querySelectorAll('[data-del]').forEach((b) => {
      b.onclick = async () => {
        if (!confirm('삭제할까요?')) return
        await api(`/api/watches/${b.dataset.del}`, { method: 'DELETE' }); render()
      }
    })
    // 🚫 관심없음 지금 해제 — 행을 지우면 다음 조회부터 추천에 다시 나온다
    panel.querySelectorAll('[data-undismiss]').forEach((b) => {
      b.onclick = async () => {
        b.disabled = true
        try {
          await api(`/api/hot/dismiss/${encodeURIComponent(b.dataset.undismiss)}`, { method: 'DELETE' })
          render()
        } catch (e) {
          b.disabled = false
          toast(panel, e.message)
        }
      }
    })
  } catch (e) {
    if (e.message !== 'unauthorized') {
      panel.innerHTML = stateBox(
        '불러오지 못했어요', e.message,
        '<button class="btn btn-sm" id="retry">다시 시도</button>'
      )
      $('#retry').onclick = () => render()
    }
  }
}

// ---------------------------------------------------------------- 상태바
//
// 마지막 수집 시각 · 총 영상 수 · 오늘 쓴 할당량. 수집이 도는 동안엔 5초,
// 평소엔 60초마다 갱신한다.
let statusTimer = null
// 마지막으로 읽은 상태. 발굴 탭의 예심 배지처럼 다른 화면에서도 쓴다.
let lastStatus = null

const UNIT_SOURCE_LABEL = {
  collect: '수집', channels: '채널 갱신', comments: '댓글 수집',
  'yt-search': '유튜브 검색', 'channel-search': '채널 검색', 'channel-lookup': '채널 조회',
  etc: '기타'
}

// 어디에 얼마를 썼는지 + 어느 범위를 센 값인지. 상태바 툴팁으로 붙는다.
function unitsTip(s) {
  const by = Object.entries(s.units_by ?? {})
    .sort((a, b) => b[1] - a[1])
    .map(([k, v]) => `${UNIT_SOURCE_LABEL[k] ?? k} ${fmt(v)}`)
    .join(' · ')
  return [
    s.units_shared
      ? '모든 인스턴스(Railway·집·학교) 합산 — yt_quota_log 기준'
      : '이 서버에서 쓴 것만 (yt_quota_log 미실행 · TODO-SQL.md 0-D)',
    by || '오늘 쓴 유닛 없음',
    s.quota_note ?? ''
  ].filter(Boolean).join('\n')
}

// 지금 설정으로 하루에 얼마나 쓰게 되는지. 0 인 항목은 감춘다.
function estimateTip(e) {
  const lines = Object.entries(e.by ?? {})
    .filter(([, v]) => v > 0)
    .sort((a, b) => b[1] - a[1])
    .map(([k, v]) => `${k} ${fmt(v)}`)
  return [`정규 수집 하루 ${e.cycles_per_day}회 기준 예상치`, ...lines].join('\n')
}

async function refreshStatus() {
  const el = $('#status')
  if (!el) return
  try {
    const s = await api('/api/status')
    lastStatus = s
    const pct = Math.min(100, Math.round((s.units_today / s.quota_limit) * 100))
    const level = pct >= 90 ? 'danger' : pct >= 70 ? 'warn' : ''
    const at = s.last_run
      ? new Date(s.last_run.at).toLocaleString('ko-KR',
          { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })
      : '없음'

    el.innerHTML = `
      <span class="st">${s.collecting
        ? '<span class="dot"></span><span class="st-live">수집 중...</span>'
        : `⏱ 마지막 수집 <b>${esc(at)}</b>`}</span>
      <span class="st">🎞 영상 <b>${fmt(s.total_videos)}</b>개</span>
      <span class="st ${level ? `st-${level}` : ''}" title="${esc(unitsTip(s))}">
        ⚡ 오늘 <b>${fmt(s.units_today)}</b> / ${fmt(s.quota_limit)}유닛${
          s.units_shared ? '' : ' <span class="muted">(이 서버만)</span>'}${
          s.comment_units_today ? ` <span class="muted">(💬 ${fmt(s.comment_units_today)})</span>` : ''}</span>
      <span class="bar ${level ? `bar-${level}` : ''}" title="${pct}% 사용 (${esc(s.quota_date)} 태평양 기준)">
        <span style="width:${pct}%"></span>
      </span>
      ${s.estimate ? `<span class="st" title="${esc(estimateTip(s.estimate))}">📐 예상 <b>${fmt(s.estimate.total)}</b>유닛/일</span>` : ''}
      ${s.last_run?.aborted === 'quota'
        ? `<span class="st st-danger" title="${esc(s.quota_note ?? '')}">
             <b>할당량 초과로 중단</b> · 태평양 자정(한국 오후 4~5시경) 리셋 후 재시도</span>` : ''}
      ${s.last_run?.errors
        ? `<span class="st st-warn"><b>최근 수집 오류 ${s.last_run.errors}건</b></span>` : ''}
    `
    clearTimeout(statusTimer)
    statusTimer = setTimeout(refreshStatus, s.collecting ? 5000 : 60000)
  } catch {
    el.innerHTML = '' // 인증 만료 등은 게이트가 처리한다
  }
}

// 탭은 네 개로 고정한다. 급상승처럼 설정에 따라 생기는 화면은 탭을 늘리지 않고
// 광산 안의 갱도 칩으로 붙는다 (탭 줄이 다시 스크롤되기 시작하면 원점이다).
function renderTabs() {
  const defs = [
    ['brief', '📥 브리핑', '오늘 볼 것만 — 검토 대기 · 주목 후보 · 탐사 요약 · 상태'],
    ['mine', '💎 광산', '묵은 검증 · 신작 · HOT — 갱도 칩으로 골라 캡니다'],
    ['picks', '⭐ 후보함', '예심 통과분과 내가 담은 영상 (별은 여기로 모입니다)'],
    ['manage', '⚙️ 관리', '감시 대상·수집 설정 + 주간 리포트 · 추적 중']
  ]
  $('#tabs').innerHTML = defs
    .map(([k, t, tip]) => `<button class="tab ${tab === k ? 'tab-on' : ''}" data-tab="${k}"
      title="${esc(tip)}">${t}</button>`)
    .join('')
  document.querySelectorAll('.tab').forEach((b) => {
    b.onclick = () => { tab = b.dataset.tab; renderTabs(); render() }
  })
}

// 로고 = 처음으로. 탭·갱도·정렬·필터를 기본값으로 되돌리고 목록과 상태바를 다시 읽는다.
$('#home').onclick = () => {
  tab = 'brief'
  shaft = 'dig'
  freshSignalOnly = true
  digSort = 'dig'
  digGroup = 'all'; digChannel = 'all'; digSubs = 'all'
  digFormat = 'long'; digPeriod = 'all'
  window.scrollTo({ top: 0, behavior: 'smooth' })
  renderTabs()
  render()
  refreshStatus()
}

$('#run').onclick = async () => {
  const btn = $('#run')
  btn.disabled = true; btn.textContent = '수집 중...'
  // 서버에 요청이 닿기 전에도 상태바가 바로 반응하게 직접 그린다
  $('#status').innerHTML =
    '<span class="st"><span class="dot"></span><span class="st-live">수집 중...</span></span>'
  clearTimeout(statusTimer)
  statusTimer = setTimeout(refreshStatus, 3000)
  try {
    await api('/api/collect', { method: 'POST' })
    await render()
  } catch (e) {
    $('#status').innerHTML = `<span class="st st-danger"><b>${esc(e.message)}</b></span>`
  }
  btn.disabled = false; btn.textContent = '지금 수집'
  refreshStatus()
}

$('#enter').onclick = async () => {
  try {
    await api('/api/login', { method: 'POST', body: JSON.stringify({ code: $('#code').value }) })
    showApp()
  } catch (e) { $('#gate-err').textContent = e.message }
}
$('#code').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#enter').click() })

fetch('/api/session').then((r) => r.json()).then((d) => d.ok ? showApp() : showGate()).catch(showGate)
</script>
</body>
</html>
